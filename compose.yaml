services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg18-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-my_data_hub}
      POSTGRES_USER: ${POSTGRES_USER:-my_data_hub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    shm_size: 1gb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-my_data_hub} -d ${POSTGRES_DB:-my_data_hub}"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [internal]

  api:
    build: .
    restart: unless-stopped
    command: ["api", "serve"]
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${MY_DATA_HUB_API_PORT:-8080}:${MY_DATA_HUB_API_PORT:-8080}"
    volumes:
      - ./artifacts:/var/lib/my-data-hub/artifacts
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os,urllib.request; p=os.getenv('MY_DATA_HUB_API_PORT','8080'); urllib.request.urlopen(f'http://127.0.0.1:{p}/health/live', timeout=3).read()"
      interval: 15s
      timeout: 5s
      retries: 10
    networks: [internal]

  orchestrator:
    build: .
    restart: unless-stopped
    command: ["orchestrator", "run-loop"]
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./artifacts:/var/lib/my-data-hub/artifacts
    networks: [internal]

networks:
  internal:
    driver: bridge

volumes:
  postgres-data:
