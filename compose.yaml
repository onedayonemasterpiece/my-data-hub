name: my-data-hub-disposable-integration

# CI/local integration-test infrastructure only. It has no restart policy, named volume,
# or production/control-plane role. Always use `docker compose down -v`.
x-my-data-hub-profile: disposable-integration-test-only

services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg18-bookworm
    restart: "no"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-my_data_hub_test}
      POSTGRES_USER: ${POSTGRES_USER:-my_data_hub_test}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set an integration-only POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    tmpfs:
      - /var/lib/postgresql:size=1g,mode=0700,uid=999,gid=999
    shm_size: 512mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [integration]

  api:
    build: .
    restart: "no"
    command: ["api", "serve"]
    env_file: ${MY_DATA_HUB_INTEGRATION_ENV_FILE:-.env.example}
    depends_on:
      postgres: {condition: service_healthy}
    ports:
      - "127.0.0.1:${MY_DATA_HUB_API_PORT:-8080}:${MY_DATA_HUB_API_PORT:-8080}"
    networks: [integration]

  orchestrator:
    build: .
    restart: "no"
    command: ["orchestrator", "run-loop"]
    env_file: ${MY_DATA_HUB_INTEGRATION_ENV_FILE:-.env.example}
    depends_on:
      postgres: {condition: service_healthy}
    networks: [integration]

  mcp:
    profiles: [disposable-mcp]
    build: .
    restart: "no"
    command: ["mcp", "serve", "--transport", "streamable-http"]
    env_file: ${MY_DATA_HUB_INTEGRATION_ENV_FILE:-.env.example}
    depends_on:
      postgres: {condition: service_healthy}
    ports:
      - "127.0.0.1:${MY_DATA_HUB_MCP_PORT:-8765}:${MY_DATA_HUB_MCP_PORT:-8765}"
    networks: [integration]

networks:
  # Host-side integration probes connect through the loopback-only published
  # port. Docker's `internal: true` isolates even that path on this engine, so
  # confidentiality is enforced by the explicit 127.0.0.1 bindings instead.
  integration: {}
