name: my-data-hub

x-app: &app
  image: my-data-hub:${MY_DATA_HUB_IMAGE_TAG:-same-host}
  build:
    context: .
  restart: unless-stopped
  networks: [internal]

services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg18-bookworm
    restart: unless-stopped
    env_file: ${MY_DATA_HUB_ENV_DIR:?set MY_DATA_HUB_ENV_DIR}/postgres.env
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    shm_size: 512mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [internal]

  api:
    <<: *app
    env_file: ${MY_DATA_HUB_ENV_DIR}/api.env
    command: ["api", "serve"]
    depends_on:
      postgres: {condition: service_healthy}
    ports:
      - "127.0.0.1:${MY_DATA_HUB_API_PORT:-8080}:8080"
    volumes:
      - artifacts:/var/lib/my-data-hub/artifacts
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health/live', timeout=3).read()"]
      interval: 15s
      timeout: 5s
      retries: 10

  orchestrator:
    <<: *app
    env_file: ${MY_DATA_HUB_ENV_DIR}/orchestrator.env
    command: ["orchestrator", "run-loop"]
    depends_on:
      postgres: {condition: service_healthy}
    volumes:
      - artifacts:/var/lib/my-data-hub/artifacts

  connector-committer:
    <<: *app
    env_file: ${MY_DATA_HUB_ENV_DIR}/committer.env
    entrypoint: ["/bin/bash", "deploy/same-host/committer-loop.sh"]
    command: []
    depends_on:
      postgres: {condition: service_healthy}

  backup:
    image: my-data-hub-backup:${MY_DATA_HUB_IMAGE_TAG:-same-host}
    build:
      context: .
      dockerfile: deploy/same-host/Dockerfile.backup
    restart: unless-stopped
    user: "${MY_DATA_HUB_RUNTIME_UID:-1000}:${MY_DATA_HUB_RUNTIME_GID:-1000}"
    env_file: ${MY_DATA_HUB_ENV_DIR}/backup.env
    depends_on:
      postgres: {condition: service_healthy}
    volumes:
      - ${MY_DATA_HUB_STATE_DIR:?set MY_DATA_HUB_STATE_DIR}/backups:/var/lib/my-data-hub/backups
    healthcheck:
      test: ["CMD-SHELL", "test -s /var/lib/my-data-hub/backups/last-success && test $$(($$(date +%s) - $$(date -d \"$$(cat /var/lib/my-data-hub/backups/last-success)\" +%s))) -lt 90000"]
      interval: 1h
      timeout: 5s
      retries: 2
      start_period: 30m
    networks: [internal]

  mcp:
    <<: *app
    profiles: [remote-mcp]
    env_file: ${MY_DATA_HUB_ENV_DIR}/mcp.env
    command: ["mcp", "serve", "--transport", "streamable-http"]
    depends_on:
      postgres: {condition: service_healthy}
    ports:
      - "127.0.0.1:${MY_DATA_HUB_MCP_PORT:-8765}:8765"

  role-bootstrap:
    <<: *app
    profiles: [admin]
    restart: "no"
    env_file: ${MY_DATA_HUB_ENV_DIR}/admin.env
    entrypoint: ["python", "scripts/provision_postgres_roles.py"]
    command: ["--bootstrap-only"]
    depends_on:
      postgres: {condition: service_healthy}

  login-provision:
    <<: *app
    profiles: [admin]
    restart: "no"
    env_file: ${MY_DATA_HUB_ENV_DIR}/admin.env
    entrypoint: ["python", "scripts/provision_postgres_logins.py"]
    command: []
    depends_on:
      postgres: {condition: service_healthy}

  migrate:
    <<: *app
    profiles: [admin]
    restart: "no"
    env_file: ${MY_DATA_HUB_ENV_DIR}/migrator.env
    command: ["db", "migrate"]
    depends_on:
      postgres: {condition: service_healthy}

  role-provision:
    <<: *app
    profiles: [admin]
    restart: "no"
    env_file: ${MY_DATA_HUB_ENV_DIR}/admin.env
    entrypoint: ["python", "scripts/provision_postgres_roles.py"]
    command: []
    depends_on:
      postgres: {condition: service_healthy}

  identity-verify:
    <<: *app
    profiles: [admin]
    restart: "no"
    env_file: ${MY_DATA_HUB_ENV_DIR}/admin.env
    entrypoint: ["python", "scripts/verify_service_identities.py"]
    command: []
    depends_on:
      postgres: {condition: service_healthy}

  role-probe:
    <<: *app
    profiles: [admin]
    restart: "no"
    env_file: ${MY_DATA_HUB_ENV_DIR}/admin.env
    entrypoint: ["python", "scripts/verify_postgres_roles.py"]
    command: []
    depends_on:
      postgres: {condition: service_healthy}

networks:
  internal:
    name: my-data-hub-internal

volumes:
  postgres-data:
    name: my-data-hub-postgres-data
  artifacts:
    name: my-data-hub-artifacts
