name: my-data-hub-control-plane

# Optional overlay for the single-user Record Idea Hub Android intake.
# It does not create another service: the existing control-plane container
# receives one additional private env file and exposes the bounded routes
# already mounted by my_data_hub.voice_intake.runtime.
services:
  control-plane:
    env_file:
      - path: "${MY_DATA_HUB_CONTROL_PROVIDER_ENV_FILE:-./.state/control-plane/provider.env}"
        required: true
      - path: "${MY_DATA_HUB_MASTER_ASSET_DIR:-./.state/master-assets}/master-assets.env"
        required: true
      - path: "${MY_DATA_HUB_VOICE_ENV_FILE:-./.state/control-plane/voice-intake.env}"
        required: true
