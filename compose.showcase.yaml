services:
  remote-mcp:
    environment:
      MY_DATA_HUB_SHOWCASE_ENABLED: "true"
      MY_DATA_HUB_SHOWCASE_GATEWAY_URL: "http://127.0.0.1:${MY_DATA_HUB_SHOWCASE_RUNTIME_PORT:-8790}/internal/mcp-showcase/invoke"
      MY_DATA_HUB_SHOWCASE_GATEWAY_TOKEN_FILE: /run/secrets/showcase-gateway.key
      MY_DATA_HUB_MCP_SCOPES: "${MY_DATA_HUB_MCP_SCOPES_WITH_SHOWCASE:?set the existing MCP scopes plus showcase:read and showcase:write}"
    volumes:
      - "${MY_DATA_HUB_SHOWCASE_GATEWAY_TOKEN_FILE:?set an absolute 0600 service-token path}:/run/secrets/showcase-gateway.key:ro"
    depends_on:
      showcase-runtime:
        condition: service_healthy

  showcase-runtime:
    build:
      context: .
      dockerfile: deploy/showcase-runtime/Dockerfile
    image: "${MY_DATA_HUB_SHOWCASE_IMAGE:-my-data-hub-showcase:local}"
    network_mode: host
    restart: unless-stopped
    read_only: true
    init: true
    user: "65532:65532"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 160
    mem_limit: "${MY_DATA_HUB_SHOWCASE_MEMORY_LIMIT:-768m}"
    cpus: "${MY_DATA_HUB_SHOWCASE_CPU_LIMIT:-1.50}"
    env_file:
      - "${MY_DATA_HUB_SHOWCASE_RUNTIME_ENV_FILE:?set the private showcase runtime env file}"
    environment:
      MY_DATA_HUB_ENVIRONMENT: production
      MY_DATA_HUB_SHOWCASE_ENABLED: "true"
      MY_DATA_HUB_SHOWCASE_RUNTIME_HOST: 127.0.0.1
      MY_DATA_HUB_SHOWCASE_RUNTIME_PORT: "${MY_DATA_HUB_SHOWCASE_RUNTIME_PORT:-8790}"
      MY_DATA_HUB_SHOWCASE_RUNTIME_TOKEN_FILE: /run/secrets/showcase-gateway.key
      MY_DATA_HUB_SHOWCASE_OPERATION_JOURNAL: /var/lib/my-data-hub-showcase/showcase-operations.json
      MY_DATA_HUB_SHOWCASE_SITE_TEMPLATE_DIR: /opt/showcase-site
      MY_DATA_HUB_SHOWCASE_SITE_DIR: /work/showcase-site
      MY_DATA_HUB_ARTIFACT_ROOT: /var/lib/my-data-hub-showcase
    volumes:
      - "${MY_DATA_HUB_SHOWCASE_GATEWAY_TOKEN_FILE:?set an absolute 0600 service-token path}:/run/secrets/showcase-gateway.key:ro"
      - showcase-state:/var/lib/my-data-hub-showcase
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
      - /run:rw,noexec,nosuid,nodev,size=16m,mode=755
      - /work:rw,nosuid,nodev,size=384m,mode=700,uid=65532,gid=65532
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:${MY_DATA_HUB_SHOWCASE_RUNTIME_PORT:-8790}/health/ready', timeout=3).read()"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  showcase-state:
    name: "${MY_DATA_HUB_SHOWCASE_STATE_VOLUME:-my-data-hub-showcase-state}"
