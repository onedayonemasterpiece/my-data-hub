mode: phased_fanout_then_serial_integration
repo: onedayonemasterpiece/my-data-hub
base_ref: de657d63e4662e69dfb7169bc67aa65e8a9bda71
base_branch: main
integration_branch: integration/operational-mvp
global_constraints:
  - no local production PostgreSQL/PGDATA/canonical rows
  - exact source bytes immutable
  - Region Talk production pipeline paused and publication disabled
  - no public Kaggle resource or public PostgreSQL endpoint
  - only read-only YDB access
  - secrets never enter Git, receipts, logs, or chat
verification_owner: root
stop_conditions:
  - destructive action targets an unregistered or foreign resource
  - source credential cannot be proven read-only
  - an operation would enable publication or full Region Talk cutover
lanes:
