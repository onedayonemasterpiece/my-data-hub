    role: worker
    requirement_ids: [R02, R05, R13]
    target: donor compatibility, one Kaggle adapter, real provider matrix
    depends_on: [discovery]
    execution_mode: serial_after_dependency
    branch: agent/operational-mvp/l01-provider
    worktree: /home/dev/.codex/worktrees/my-data-hub/operational-l01-provider
    writable_files: [src/my_data_hub/providers/**, scripts/provider/**, tests/provider/**, .codex/lanes/L01-provider/**]
    forbidden_files: [sql/migrations/**, src/my_data_hub/mcp/**, deploy/**]
    expected_output: committed provider implementation and real-run receipts
    verification_scope: targeted_and_real_provider
    effort: xhigh
    status: read_only_discovery
