name: tts-yazyki-rossii-main-once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/tts-yazyki-rossii-main-once.yml

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"
  MY_DATA_HUB_MCP_CANARY_ENDPOINT: ${{ vars.MY_DATA_HUB_MCP_CANARY_ENDPOINT || 'https://mcp-datahub.kenigevents.ru/mcp' }}

jobs:
  submit-and-wait:
    environment:
      name: devstand
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      MY_DATA_HUB_MCP_PROVIDER_OPERATOR_TOKEN: ${{ secrets.MY_DATA_HUB_MCP_PROVIDER_OPERATOR_TOKEN }}
      MY_DATA_HUB_MCP_ACCEPTANCE_OPERATOR_TOKEN: ${{ secrets.MY_DATA_HUB_MCP_ACCEPTANCE_OPERATOR_TOKEN }}
      MY_DATA_HUB_MCP_MIGRATION_OPERATOR_TOKEN: ${{ secrets.MY_DATA_HUB_MCP_MIGRATION_OPERATOR_TOKEN }}
      MY_DATA_HUB_MCP_CANARY_TOKEN: ${{ secrets.MY_DATA_HUB_MCP_READER_TOKEN }}
    steps:
      - name: Check out exact reviewed one-off controller
        uses: actions/checkout@v4
        with:
          ref: 849dbfe909daae17b97072150b835b51c78cd8b8
          persist-credentials: false

      - name: Verify exact controller commit and bearer presence
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "849dbfe909daae17b97072150b835b51c78cd8b8"
          present=0
          for value in \
            "$MY_DATA_HUB_MCP_PROVIDER_OPERATOR_TOKEN" \
            "$MY_DATA_HUB_MCP_ACCEPTANCE_OPERATOR_TOKEN" \
            "$MY_DATA_HUB_MCP_MIGRATION_OPERATOR_TOKEN" \
            "$MY_DATA_HUB_MCP_CANARY_TOKEN"; do
            if test "${#value}" -ge 24; then present=1; fi
          done
          test "$present" = 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install trusted provider client
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,kaggle]'

      - name: Submit and monitor Qwen3-TTS Kaggle CPU run
        run: python scratch/tts-yazyki-rossii/submit.py

      - name: Upload exact provider receipts and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tts-yazyki-rossii-provider-control-main
          path: artifacts/tts-yazyki-rossii/
          if-no-files-found: warn
          retention-days: 7
