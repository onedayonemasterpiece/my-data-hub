name: Showcase local test bundle
on:
  push:
    branches: [work/showcase-product-mcp-20260904]
    paths: [.github/workflows/showcase-product-materialize.yml]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Package tracked source and test dependencies, never credentials
        run: |
          mkdir -p /tmp/showcase-local/wheels
          git archive --format=tar.gz HEAD > /tmp/showcase-local/source.tar.gz
          git rev-parse HEAD > /tmp/showcase-local/source-revision.txt
          python -m pip download -d /tmp/showcase-local/wheels mcp==2.0.0 ruff pytest-asyncio hypothesis 'psycopg[binary,pool]' pglast PyJWT
          cd showcase-site
          npm ci --no-audit --no-fund
          tar czf /tmp/showcase-local/node_modules.tar.gz node_modules
      - uses: actions/upload-artifact@v4
        with:
          name: showcase-local-test-bundle
          path: /tmp/showcase-local
          retention-days: 3
