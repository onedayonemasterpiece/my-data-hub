name: Telegram thread 1169 environment probe

on:
  push:
    branches:
      - ops/telegram-thread-1169-probe-20260825
    paths:
      - .github/workflows/telegram-thread-1169-probe.yml

permissions:
  contents: write

jobs:
  probe:
    runs-on: [self-hosted, linux, my-data-hub-devstand]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/telegram-thread-1169-probe-20260825

      - name: Record non-secret capability facts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python - <<'PY'
          from __future__ import annotations

          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          idea_hub = Path('/home/dev/projects/idea-hub')
          events_bot = Path('/home/dev/projects/events-bot-new')
          env_files = [
              idea_hub / '.env',
              events_bot / '.env',
              Path('/home/dev/projects/my-data-hub/.env'),
          ]

          session_names = {
              'IDEA_HUB_TELEGRAM_SESSION', 'TELEGRAM_SESSION', 'TG_SESSION',
              'TELETHON_SESSION', 'TG_USER_SESSION', 'TELEGRAM_USER_SESSION',
              'TELEGRAM_STRING_SESSION', 'TELETHON_STRING_SESSION',
          }
          bundle_names = {
              'IDEA_HUB_TELEGRAM_AUTH_BUNDLE', 'TELEGRAM_AUTH_BUNDLE',
              'TELEGRAM_AUTH_BUNDLE_E2E',
          }
          api_id_names = {'IDEA_HUB_TG_API_ID', 'TG_API_ID', 'TELEGRAM_API_ID'}
          api_hash_names = {'IDEA_HUB_TG_API_HASH', 'TG_API_HASH', 'TELEGRAM_API_HASH'}

          def declared_keys(path: Path) -> set[str]:
              if not path.is_file():
                  return set()
              result: set[str] = set()
              try:
                  for raw in path.read_text(encoding='utf-8', errors='ignore').splitlines():
                      match = re.match(r'^\s*(?:export\s+)?([A-Za-z_][A-Za-z0-9_]*)\s*=', raw)
                      if match:
                          result.add(match.group(1))
              except OSError:
                  return set()
              return result

          keys_by_file = {str(path): declared_keys(path) for path in env_files}
          all_keys = set().union(*keys_by_file.values()) if keys_by_file else set()
          credentials_declared = bool(
              (all_keys & bundle_names)
              or ((all_keys & session_names) and (all_keys & api_id_names) and (all_keys & api_hash_names))
          )

          def git_ok(path: Path) -> bool:
              if not (path / '.git').exists():
                  return False
              completed = subprocess.run(
                  ['git', '-C', str(path), 'rev-parse', '--is-inside-work-tree'],
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL,
                  check=False,
              )
              return completed.returncode == 0

          report = {
              'schema_version': 1,
              'idea_hub_repo_present': git_ok(idea_hub),
              'idea_hub_repo_writable': idea_hub.is_dir() and os.access(idea_hub, os.W_OK),
              'events_bot_repo_present': git_ok(events_bot),
              'telegram_credentials_declared_in_known_local_env': credentials_declared,
              'idea_hub_env_present': (idea_hub / '.env').is_file(),
              'events_bot_env_present': (events_bot / '.env').is_file(),
              'my_data_hub_env_present': Path('/home/dev/projects/my-data-hub/.env').is_file(),
              'python_available': subprocess.run(
                  ['python3', '--version'],
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL,
                  check=False,
              ).returncode == 0,
          }
          Path('artifacts/telegram-thread-1169-probe.json').write_text(
              json.dumps(report, ensure_ascii=False, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          PY

      - name: Commit probe receipt
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/telegram-thread-1169-probe.json
          if ! git diff --cached --quiet; then
            git commit -m "ops: record Telegram intake capability probe"
            git push origin HEAD:ops/telegram-thread-1169-probe-20260825
          fi
