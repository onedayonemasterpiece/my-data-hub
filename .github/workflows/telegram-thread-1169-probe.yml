name: Diagnose faster-whisper import

on:
  push:
    branches:
      - ops/telegram-thread-1169-probe-20260825
    paths:
      - .github/workflows/telegram-thread-1169-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the same transcription runtime
        run: >-
          python -m pip install --disable-pip-version-check --quiet
          'faster-whisper==1.2.0'

      - name: Import and report dependency failure
        shell: bash
        run: |
          python - <<'PY'
          try:
              import faster_whisper
              from faster_whisper import WhisperModel
              print('IMPORT_OK', getattr(faster_whisper, '__version__', 'unknown'))
          except Exception as exc:
              print('IMPORT_ERROR_TYPE', type(exc).__name__)
              print('IMPORT_ERROR_NAME', getattr(exc, 'name', None))
              print('IMPORT_ERROR_TEXT', str(exc))
              raise
          PY
