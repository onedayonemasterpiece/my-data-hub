name: Telegram thread 1169 hosted credential probe

on:
  push:
    branches:
      - ops/telegram-thread-1169-probe-20260825
    paths:
      - .github/workflows/telegram-thread-1169-probe.yml

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      S1: ${{ secrets.IDEA_HUB_TELEGRAM_SESSION }}
      S2: ${{ secrets.TELEGRAM_SESSION }}
      S3: ${{ secrets.TG_SESSION }}
      S4: ${{ secrets.TELETHON_SESSION }}
      S5: ${{ secrets.TG_USER_SESSION }}
      S6: ${{ secrets.TELEGRAM_USER_SESSION }}
      S7: ${{ secrets.TELEGRAM_STRING_SESSION }}
      S8: ${{ secrets.TELETHON_STRING_SESSION }}
      S9: ${{ secrets.TG_PREMIUM_EMOJI_SESSION }}
      B1: ${{ secrets.IDEA_HUB_TELEGRAM_AUTH_BUNDLE }}
      B2: ${{ secrets.TELEGRAM_AUTH_BUNDLE }}
      B3: ${{ secrets.TELEGRAM_AUTH_BUNDLE_E2E }}
      B4: ${{ secrets.TELEGRAM_AUTH_BUNDLE_CHECK_POPULAR }}
      B5: ${{ secrets.TG_PREMIUM_EMOJI_AUTH_BUNDLE }}
      I1: ${{ secrets.IDEA_HUB_TG_API_ID }}
      I2: ${{ secrets.TG_API_ID }}
      I3: ${{ secrets.TELEGRAM_API_ID }}
      I4: ${{ secrets.SOCIAL_METRICS_TG_API_ID }}
      I5: ${{ secrets.TG_PREMIUM_EMOJI_API_ID }}
      H1: ${{ secrets.IDEA_HUB_TG_API_HASH }}
      H2: ${{ secrets.TG_API_HASH }}
      H3: ${{ secrets.TELEGRAM_API_HASH }}
      H4: ${{ secrets.SOCIAL_METRICS_TG_API_HASH }}
      H5: ${{ secrets.TG_PREMIUM_EMOJI_API_HASH }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/telegram-thread-1169-probe-20260825

      - name: Record secret-presence booleans only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python - <<'PY'
          from __future__ import annotations

          import json
          import os
          from pathlib import Path

          def present(prefix: str, count: int) -> bool:
              return any(bool(os.environ.get(f'{prefix}{index}', '').strip()) for index in range(1, count + 1))

          report = {
              'schema_version': 1,
              'hosted_runner_allocated': True,
              'telegram_auth_bundle_available': present('B', 5),
              'telegram_session_available': present('S', 9),
              'telegram_api_id_available': present('I', 5),
              'telegram_api_hash_available': present('H', 5),
          }
          report['telegram_credentials_complete'] = bool(
              report['telegram_auth_bundle_available']
              or (
                  report['telegram_session_available']
                  and report['telegram_api_id_available']
                  and report['telegram_api_hash_available']
              )
          )
          Path('artifacts/telegram-thread-1169-hosted-probe.json').write_text(
              json.dumps(report, ensure_ascii=False, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          PY

      - name: Commit probe receipt
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/telegram-thread-1169-hosted-probe.json
          if ! git diff --cached --quiet; then
            git commit -m "ops: record hosted Telegram credential probe"
            git push origin HEAD:ops/telegram-thread-1169-probe-20260825
          fi
