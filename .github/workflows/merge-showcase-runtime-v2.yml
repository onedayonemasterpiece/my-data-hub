name: Merge Verified Showcase Runtime V2

on:
  push:
    branches:
      - chatgpt/ideahub-showcase-runtime-v2-20260902
    paths:
      - .github/workflows/merge-showcase-runtime-v2.yml

permissions:
  contents: write

jobs:
  merge-main:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: showcase-site/package-lock.json

      - name: Rebase on the current main without force
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin main
          git rebase origin/main

      - name: Remove one-shot integration machinery
        run: |
          rm -f \
            .github/workflows/apply-showcase-runtime-v2.yml \
            .github/workflows/export-showcase-v2-snapshot.yml \
            .github/workflows/cleanup-showcase-runtime-v2.yml \
            .github/workflows/finalize-showcase-runtime-v2.yml \
            .github/workflows/merge-showcase-runtime-v2.yml \
            scripts/apply_showcase_runtime_v2.py \
            scripts/showcase_runtime_v2_marker.txt

      - name: Install and verify final rebased tree
        run: |
          python -m pip install -e '.[dev]'
          npm ci --prefix showcase-site --no-audit --no-fund
          ruff check \
            src/my_data_hub/showcase \
            src/my_data_hub/mcp/server.py \
            src/my_data_hub/config.py \
            tests/showcase
          pytest -q \
            tests/showcase \
            tests/test_mcp_sdk_v2_contract.py \
            tests/test_config.py \
            tests/test_control_plane_deployment.py
          if npm run --prefix showcase-site | grep -q 'test:all'; then
            npm run --prefix showcase-site test:all
          elif npm run --prefix showcase-site | grep -q 'test:build'; then
            npm run --prefix showcase-site test:build
          else
            npm run --prefix showcase-site build
          fi
          git diff --check

      - name: Commit cleanup and fast-forward main
        run: |
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore: remove showcase v2 integration scaffolding"
          fi
          git push origin HEAD:main
