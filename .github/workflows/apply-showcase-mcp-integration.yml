name: Apply Showcase MCP integration

on:
  push:
    branches:
      - chatgpt/ideahub-showcase-mcp-integration-20260902
    paths:
      - scripts/apply_showcase_mcp_integration.py
      - .github/workflows/apply-showcase-mcp-integration.yml

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply deterministic source patch
        run: python scripts/apply_showcase_mcp_integration.py
      - name: Install project
        run: python -m pip install -e '.[dev]'
      - name: Verify MCP and showcase contracts
        run: >-
          pytest -q
          tests/showcase
          tests/test_mcp_sdk_v2_contract.py
          tests/test_config.py
      - name: Lint changed Python
        run: >-
          ruff check
          src/my_data_hub/mcp/catalog.py
          src/my_data_hub/mcp/server.py
          src/my_data_hub/config.py
          tests/showcase/test_main_mcp_integration.py
      - name: Verify patch cleanliness
        run: |
          python -m compileall -q src tests/showcase
          git diff --check
      - name: Commit integrated implementation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat: expose showcase through standard MCP"
          git push origin HEAD:${GITHUB_REF_NAME}
