name: Unblock Showcase Finalizer

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/unblock-showcase-finalizer.yml

permissions:
  contents: write

jobs:
  unblock:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove premature npm cache gate
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/finalize-showcase-production-contract.yml')
          source = path.read_text(encoding='utf-8')
          source = source.replace("    if: github.actor != 'github-actions[bot]'\n", '')
          source = source.replace('          cache: npm\n', '')
          source = source.replace('          cache-dependency-path: showcase-site/package-lock.json\n', '')
          path.write_text(source, encoding='utf-8')
          PY
          rm -f .github/workflows/unblock-showcase-finalizer.yml
      - name: Commit unblock
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix(showcase): unblock production finalizer"
          git push origin HEAD:main
