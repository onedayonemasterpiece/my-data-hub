name: Showcase dependency and timeout checkpoint
on:
  push:
    branches: [work/showcase-product-mcp-20260904]
    paths: [.github/workflows/showcase-lock-checkpoint.yml]
permissions:
  contents: write
jobs:
  checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pin already resolved image dependency and scope the long-call budget
        run: |
          python - <<'PY'
          import json
          import textwrap
          from pathlib import Path
          package = Path('showcase-site/package.json')
          lock = Path('showcase-site/package-lock.json')
          manifest, resolved = json.loads(package.read_text()), json.loads(lock.read_text())
          assert resolved['packages']['node_modules/sharp']['version'] == '0.34.5'
          manifest['dependencies']['sharp'] = '0.34.5'
          resolved['packages']['']['dependencies']['sharp'] = '0.34.5'
          package.write_text(json.dumps(manifest, indent=2) + '\n')
          lock.write_text(json.dumps(resolved, indent=2) + '\n')
          path = Path('src/my_data_hub/mcp/admission.py')
          text = path.read_text()
          old = 'async with asyncio.timeout(self.limits.request_timeout_seconds):'
          assert text.count(old) == 1
          text = text.replace(old, 'async with asyncio.timeout(self.limits.request_timeout_seconds) as deadline:')
          anchor = '                    state = dict(scope.get("state") or {})'
          block = '''
          # Only authorized Showcase source/build calls get a longer budget.
          # Upload/authentication and unrelated requests keep their limits.
          if identity is not None and scope.get("method") == "POST":
              try:
                  document = json.loads(body)
                  name = document.get("params", {}).get("name")
                  required = "showcase:read" if name == "showcase.get_source" else "showcase:write"
                  if (
                      document.get("method") == "tools/call"
                      and name in {
                          "showcase.apply", "showcase.create_view", "showcase.rebuild",
                          "showcase.rotate_link", "showcase.get_source",
                      }
                      and required in identity.scopes
                  ):
                      deadline.reschedule(asyncio.get_running_loop().time() + 300)
              except (ValueError, TypeError, AttributeError):
                  pass
          '''
          assert text.count(anchor) == 1
          path.write_text(text.replace(anchor, textwrap.indent(textwrap.dedent(block).strip() + '\n', ' ' * 20) + anchor))
          PY
          python -m pip install -e '.[dev]'
          ruff format src/my_data_hub/mcp/admission.py tests/showcase/test_admission_product.py
          ruff check src/my_data_hub/mcp/admission.py tests/showcase/test_admission_product.py
          pytest -q tests/test_http_security.py tests/showcase/test_admission_product.py
          npm ci --no-audit --no-fund --prefix showcase-site
          git diff --check
      - name: Commit tested source without temporary workflow
        run: |
          git rm .github/workflows/showcase-lock-checkpoint.yml
          git add showcase-site/package.json showcase-site/package-lock.json src/my_data_hub/mcp/admission.py tests/showcase/test_admission_product.py
          git config user.name 'ChatGPT source maintenance'
          git config user.email 'noreply@openai.com'
          git commit -m 'fix(showcase): pin PNG renderer and scope long-call timeout to authorized tools'
          git push origin HEAD:work/showcase-product-mcp-20260904
          git archive --format=tar.gz HEAD > /tmp/showcase-verified-source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: showcase-verified-source
          path: /tmp/showcase-verified-source.tar.gz
          retention-days: 7
