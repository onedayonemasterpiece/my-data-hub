name: Voice recovery source application
on:
  push:
    branches: [fix/voice-recovery-20260905]
permissions:
  contents: write
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install media tools
        run: sudo apt-get update && sudo apt-get install --yes ffmpeg
      - name: Apply exact ChatGPT-authored source edits
        run: |
          test -f .maintenance/apply-voice-recovery.py
          python .maintenance/apply-voice-recovery.py
          sha256sum -c <<'HASHES'
          431afc67b4fba5df66c99f85ad0f185b21f26564f6c65fe8568394d9644c4948  src/my_data_hub/voice_intake_v2/api.py
          b6768d4d51f1f607eeaf9bc8db690d51a759383e36b2ccc26dc7781c4e0b3b48  src/my_data_hub/voice_intake_v2/inference.py
          dafa87760d3f111d8f75e27812e37d9496485a65eb3dccdc7681ed51d1e6e3e2  src/my_data_hub/voice_intake_v2/store.py
          33eeb01dd98a2138a7cc28924da6ec9fa2f491d7e2b388045bf78bfc094fc6c1  src/my_data_hub/voice_intake_v2/worker.py
          28ea3332252ccbdcd0bd09f92f13372f124309723e99bbbc3444a3d752462b39  tests/voice_intake_v2/test_worker.py
          HASHES
          rm .maintenance/apply-voice-recovery.py
          git diff --check
      - name: Install test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Sort imports and verify voice regressions
        run: |
          ruff check --select I --fix src/my_data_hub/voice_intake_v2 tests/voice_intake_v2
          python -m compileall -q src tests
          pytest -q tests/voice_intake tests/voice_intake_v2
      - name: Save actual source on the authorized branch
        run: |
          git config user.name 'OpenAI ChatGPT'
          git config user.email 'noreply@openai.com'
          git add src/my_data_hub/voice_intake_v2 tests/voice_intake_v2 .maintenance/apply-voice-recovery.py
          git commit -m 'fix(voice-v2): recover durable stages without phone-driven retries'
          git push origin HEAD:fix/voice-recovery-20260905
          git rev-parse HEAD
          git diff --stat b816f9a5c6f3d166c17b5c2c31110896e40241e2..HEAD
      - name: Repository validation
        run: python scripts/validate_repository.py && python scripts/scan_tracked_secrets.py
      - name: Full tests
        run: pytest
      - name: Lint and typing
        run: ruff check src/my_data_hub/voice_intake_v2 tests/voice_intake_v2 && mypy
      - name: Export source and local lint tool
        if: always()
        run: |
          mkdir -p evidence/tooling
          git archive --format=tar HEAD > evidence/source.tar
          git rev-parse HEAD > evidence/SOURCE_SHA.txt
          python -m pip download --no-deps ruff -d evidence/tooling
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: voice-recovery-source-evidence
          path: evidence/
          retention-days: 3
          if-no-files-found: error
