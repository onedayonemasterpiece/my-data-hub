name: devstand-deploy

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Exact main commit to deploy
        required: true
        type: string
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: devstand-deploy
  cancel-in-progress: false

jobs:
  deploy-and-prove:
    runs-on: ubuntu-latest
    environment: devstand
    env:
      DEPLOY_COMMIT: ${{ inputs.commit || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_COMMIT }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Preflight protected devstand credentials
        env:
          DEVSTAND_SSH_HOST: ${{ secrets.DEVSTAND_SSH_HOST }}
          DEVSTAND_SSH_USER: ${{ secrets.DEVSTAND_SSH_USER }}
          DEVSTAND_SSH_PRIVATE_KEY: ${{ secrets.DEVSTAND_SSH_PRIVATE_KEY }}
          DEVSTAND_SSH_HOST_KEY: ${{ secrets.DEVSTAND_SSH_HOST_KEY }}
        run: |
          test -n "$DEVSTAND_SSH_HOST" || { echo 'missing DEVSTAND_SSH_HOST' >&2; exit 2; }
          test -n "$DEVSTAND_SSH_USER" || { echo 'missing DEVSTAND_SSH_USER' >&2; exit 2; }
          test -n "$DEVSTAND_SSH_PRIVATE_KEY" || { echo 'missing DEVSTAND_SSH_PRIVATE_KEY' >&2; exit 2; }
          test -n "$DEVSTAND_SSH_HOST_KEY" || { echo 'missing DEVSTAND_SSH_HOST_KEY' >&2; exit 2; }
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEVSTAND_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEVSTAND_SSH_HOST_KEY" > ~/.ssh/known_hosts
      - name: Deploy exact commit and run post-deploy proof
        env:
          DEVSTAND_SSH_HOST: ${{ secrets.DEVSTAND_SSH_HOST }}
          DEVSTAND_SSH_USER: ${{ secrets.DEVSTAND_SSH_USER }}
        run: |
          ssh "$DEVSTAND_SSH_USER@$DEVSTAND_SSH_HOST" bash -s -- "$DEPLOY_COMMIT" <<'REMOTE'
          set -Eeuo pipefail
          commit="$1"
          cd /opt/my-data-hub/current
          git fetch --prune origin main
          test "$(git rev-parse "${commit}^{commit}")" = "$commit"
          git checkout --detach "$commit"
          /opt/my-data-hub/venv/bin/pip install -e '.[dev]'
          sudo systemctl start my-data-hub-role-bootstrap.service
          sudo systemctl start my-data-hub-migrate.service
          sudo systemctl start my-data-hub-role-provision.service
          sudo systemctl start my-data-hub-db-verify.service
          sudo systemctl start my-data-hub-identity-verify.service
          sudo systemctl restart my-data-hub-api my-data-hub-orchestrator my-data-hub-mcp
          sudo systemctl is-active --quiet my-data-hub-api my-data-hub-orchestrator my-data-hub-mcp
          test "$(git rev-parse HEAD)" = "$commit"
          grep -qx 'MY_DATA_HUB_SCHEDULER_ENABLED=false' /etc/my-data-hub/my-data-hub.env
          grep -qx 'MY_DATA_HUB_PRODUCTION_PUBLISH_ENABLED=false' /etc/my-data-hub/my-data-hub.env
          grep -qx 'MY_DATA_HUB_MCP_WRITE_ENABLED=false' /etc/my-data-hub/my-data-hub.env
          ! ss -H -ltn | awk '{print $4}' | grep -Eq '(^0\.0\.0\.0:|^\*:|^\[::\]:)(5432|8080|8765)$'
          for port in 5432 8080 8765; do
            ss -H -ltn | awk '{print $4}' | grep -qx "127.0.0.1:$port"
          done
          REMOTE
      - name: Prove public endpoint rejects missing token
        run: test "$(curl -sS -o /dev/null -w '%{http_code}' https://mcp-datahub.kenigevents.ru/mcp)" = 401
      - name: Write deployment receipt
        if: always()
        run: |
          outcome=PASS; observed="deploy and post-deploy checks passed"
          if [[ "${{ job.status }}" != success ]]; then outcome=FAIL; observed="deploy or post-deploy check failed"; fi
          python scripts/write_workflow_receipt.py --workflow devstand-deploy --environment devstand \
            --outcome "$outcome" --observed "$observed" --resource deployed_commit="$DEPLOY_COMMIT" \
            --hash-file compose=compose.yaml --output artifacts/devstand-deploy-receipt.json
      - name: Upload deployment receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: devstand-deploy-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/devstand-deploy-receipt.json
          if-no-files-found: error
