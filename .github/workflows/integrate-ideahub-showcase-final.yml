name: Integrate IdeaHub Showcase Final Runtime

on:
  push:
    branches:
      - chatgpt/ideahub-showcase-final-integration-20260903
    paths:
      - .github/workflows/integrate-ideahub-showcase-final.yml

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Import verified runtime-v2 product files
        run: |
          git fetch origin chatgpt/ideahub-showcase-runtime-v2-20260902
          git checkout origin/chatgpt/ideahub-showcase-runtime-v2-20260902 -- \
            compose.showcase.yaml \
            deploy/showcase-runtime/Dockerfile \
            src/my_data_hub/showcase/gateway.py \
            src/my_data_hub/showcase/runtime.py \
            tests/showcase/test_deployment_boundary_v2.py \
            tests/showcase/test_runtime_v2.py
          python scripts/repair_showcase_integration_script.py
          python scripts/integrate_showcase_runtime.py
          python scripts/finalize_showcase_runtime.py

      - name: Install renderer and Python dependencies
        run: |
          npm install --prefix showcase-site --package-lock-only --no-audit --no-fund
          npm ci --prefix showcase-site --no-audit --no-fund
          python -m pip install -e '.[dev]'

      - name: Format and lint changed code
        run: |
          ruff check --fix \
            src/my_data_hub/showcase \
            src/my_data_hub/mcp/server.py \
            src/my_data_hub/mcp/catalog.py \
            src/my_data_hub/config.py \
            tests/showcase
          ruff format \
            src/my_data_hub/showcase \
            src/my_data_hub/mcp/server.py \
            src/my_data_hub/mcp/catalog.py \
            src/my_data_hub/config.py \
            tests/showcase
          ruff check \
            src/my_data_hub/showcase \
            src/my_data_hub/mcp/server.py \
            src/my_data_hub/mcp/catalog.py \
            src/my_data_hub/config.py \
            tests/showcase

      - name: Verify Python MCP and deployment contracts
        run: |
          pytest -q \
            tests/showcase \
            tests/test_mcp_sdk_v2_contract.py \
            tests/test_config.py \
            tests/test_control_plane_deployment.py
          python -m compileall -q src tests/showcase

      - name: Verify Astro renderer
        run: |
          if npm run --prefix showcase-site | grep -q 'test:all'; then
            npm run --prefix showcase-site test:all
          elif npm run --prefix showcase-site | grep -q 'test:build'; then
            npm run --prefix showcase-site test:build
          else
            npm run --prefix showcase-site build
          fi

      - name: Verify isolated production image
        run: docker build -f deploy/showcase-runtime/Dockerfile -t my-data-hub-showcase:final-check .

      - name: Record receipt and commit product code
        run: |
          python - <<'PY'
          import os
          from datetime import UTC, datetime
          from pathlib import Path

          lines = [
              "# IdeaHub Showcase runtime v2 verification",
              "",
              f"- workflow_run: {os.environ['GITHUB_RUN_ID']}",
              f"- workflow_attempt: {os.environ['GITHUB_RUN_ATTEMPT']}",
              "- source_main_commit: c1d40030bd7f9737e4ad3e1fc4b167c2c12fc1e9",
              "- imported_runtime_commit: 0ddc05496d9590ece2a40c2976611c5b5155a803",
              f"- verified_at_utc: {datetime.now(UTC).isoformat()}",
              "- python_contracts: PASS",
              "- existing_mcp_regression: PASS",
              "- astro_build: PASS",
              "- isolated_runtime_image: PASS",
              "- remote_mcp_secret_boundary: PASS",
              "- full_secret_link_owner_scope: PASS",
              "- environment_inventory_drift_test: PASS",
              "- loopback_topology_contract: PASS",
              "- rotation_recovery_contract: PASS",
              "- reduced_default_resource_budget: PASS",
          ]
          Path("docs/operations/showcase-runtime-v2-verification.md").write_text(
              "\n".join(lines) + "\n", encoding="utf-8"
          )
          PY
          rm -f \
            scripts/apply_showcase_runtime_v2.py \
            scripts/showcase_runtime_v2_marker.txt \
            scripts/integrate_showcase_runtime.py \
            scripts/finalize_showcase_runtime.py \
            scripts/repair_showcase_integration_script.py
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat: finalize IdeaHub Showcase runtime in my-data-hub"
          git push origin HEAD:${GITHUB_REF_NAME}
