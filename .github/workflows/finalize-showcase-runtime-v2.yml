name: Finalize Showcase Runtime V2

on:
  push:
    branches:
      - chatgpt/ideahub-showcase-runtime-v2-20260902
    paths:
      - .github/workflows/finalize-showcase-runtime-v2.yml

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require verified product tree
        run: |
          test -f docs/operations/showcase-runtime-v2-verification.md
          test -f src/my_data_hub/showcase/gateway.py
          test -f src/my_data_hub/showcase/runtime.py
          test -f deploy/showcase-runtime/Dockerfile
          test -f compose.showcase.yaml
          test -f showcase-site/package-lock.json
      - name: Remove all one-shot integration files
        run: |
          rm -f \
            .github/workflows/apply-showcase-runtime-v2.yml \
            .github/workflows/export-showcase-v2-snapshot.yml \
            .github/workflows/cleanup-showcase-runtime-v2.yml \
            .github/workflows/finalize-showcase-runtime-v2.yml \
            scripts/apply_showcase_runtime_v2.py \
            scripts/showcase_runtime_v2_marker.txt
          git diff --check
      - name: Commit final product tree
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "chore: finalize showcase runtime v2 product tree"
          git push origin HEAD:${GITHUB_REF_NAME}
