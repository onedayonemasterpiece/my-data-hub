name: Classify IdeaHub Showcase Runtime

on:
  push:
    branches:
      - chatgpt/classify-ideahub-showcase-runtime-20260903
    paths:
      - .github/workflows/classify-ideahub-showcase-runtime.yml

permissions:
  contents: write

jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install project
        run: python -m pip install -e '.[dev]'

      - name: Apply canonical inventory classification
        run: python scripts/classify_showcase_runtime.py

      - name: Validate without temporary execution paths
        run: |
          mkdir -p /tmp/showcase-validator-bootstrap
          mv .github/workflows/classify-ideahub-showcase-runtime.yml /tmp/showcase-validator-bootstrap/
          mv scripts/classify_showcase_runtime.py /tmp/showcase-validator-bootstrap/
          python scripts/validate_repository.py
          python -m compileall -q src tests scripts
          pytest -q \
            tests/showcase \
            tests/test_mcp_sdk_v2_contract.py \
            tests/test_config.py \
            tests/test_control_plane_deployment.py
          ruff check scripts/validate_repository.py
          mv /tmp/showcase-validator-bootstrap/classify-ideahub-showcase-runtime.yml .github/workflows/
          mv /tmp/showcase-validator-bootstrap/classify_showcase_runtime.py scripts/

      - name: Commit validator update
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/validate_repository.py
          git diff --cached --check
          git commit -m "chore(showcase): classify runtime deployment inventory"
          git push origin HEAD:${GITHUB_REF_NAME}
