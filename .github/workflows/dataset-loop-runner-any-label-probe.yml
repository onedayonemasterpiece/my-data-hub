name: dataset-loop-runner-probe-disabled

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prohibited:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo 'Owner-hosted GitHub Actions runners are not authorized for Dataset Loop MCP.' >&2
          echo 'Do not install, register, recover, or probe a self-hosted runner.' >&2
          exit 78
