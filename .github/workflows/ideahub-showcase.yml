name: IdeaHub Showcase

on:
  push:
    paths:
      - "showcase-site/**"
      - "src/my_data_hub/showcase/**"
      - "src/my_data_hub/mcp/server.py"
      - "src/my_data_hub/mcp/admission.py"
      - "deploy/showcase-runtime/**"
      - "tests/showcase/**"
      - "docs/ideahub-showcase.md"
      - "pyproject.toml"
      - ".github/workflows/ideahub-showcase.yml"
  pull_request:
    paths: ["showcase-site/**", "src/my_data_hub/showcase/**", "src/my_data_hub/mcp/**", "tests/showcase/**", "deploy/showcase-runtime/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Python package
        run: python -m pip install -e '.[dev]'
      - name: Install Astro renderer
        working-directory: showcase-site
        run: npm ci --no-audit --no-fund
      - name: Install Chromium test runtime
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Run Showcase contract and browser tests
        env:
          SHOWCASE_BROWSER: '1'
          SHOWCASE_SCREENSHOTS: ${{ runner.temp }}/showcase-screenshots
        run: pytest -q tests/showcase --junitxml="${RUNNER_TEMP}/showcase-tests.xml"
      - name: Build and publish local smoke surface through the control layer
        env:
          MY_DATA_HUB_SHOWCASE_SOURCE_ROOT: ${{ github.workspace }}/tests/showcase/fixtures
          MY_DATA_HUB_SHOWCASE_SITE_ROOT: ${{ github.workspace }}/showcase-site
          MY_DATA_HUB_SHOWCASE_STATE_PATH: ${{ runner.temp }}/showcase/state.json
          MY_DATA_HUB_SHOWCASE_LOCAL_PUBLISH_ROOT: ${{ runner.temp }}/showcase/public
          MY_DATA_HUB_SHOWCASE_ORIGIN: https://ideas.example.test
        run: |
          python -m my_data_hub.showcase.cli rebuild main | tee "${RUNNER_TEMP}/showcase-result.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          result = json.loads((Path(os.environ["RUNNER_TEMP"]) / "showcase-result.json").read_text())
          assert result["status"] == "published"
          assert result["url"].startswith("https://ideas.example.test/v/")
          slug = result["url"].rstrip("/").split("/")[-1]
          root = Path(os.environ["RUNNER_TEMP"]) / "showcase" / "public" / "v" / slug
          assert (root / "index.html").is_file()
          assert len(list(root.glob("ideas/*/index.html"))) == 5
          assert (root / "showcase-build.json").is_file()
          assert (root / "showcase-headers.json").is_file()
          PY
      - name: Upload reproducibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ideahub-showcase-smoke
          if-no-files-found: error
          path: |
            showcase-site/package-lock.json
            ${{ runner.temp }}/showcase-tests.xml
            ${{ runner.temp }}/showcase-screenshots
            ${{ runner.temp }}/showcase-result.json
            ${{ runner.temp }}/showcase/state.json
            ${{ runner.temp }}/showcase/public
