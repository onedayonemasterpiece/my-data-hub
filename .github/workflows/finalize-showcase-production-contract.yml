name: Finalize Showcase Production Contract

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/finalize-showcase-production-contract.yml

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: showcase-site/package-lock.json

      - name: Reconcile with current main
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git pull --rebase origin main

      - name: Harden scope, resource and environment contracts
        run: |
          python - <<'PY'
          from __future__ import annotations

          import re
          from pathlib import Path

          root = Path('.')

          def read(path: str) -> str:
              return (root / path).read_text(encoding='utf-8')

          def write(path: str, value: str) -> None:
              target = root / path
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(value, encoding='utf-8')

          # A full secret link is an owner/operator capability even though the
          # operation is read-only at the HTTP/MCP annotation layer.
          catalog_path = 'src/my_data_hub/mcp/catalog.py'
          catalog = read(catalog_path)
          catalog, count = re.subn(
              r'\("showcase\.get_link",\s*"showcase:read"\)',
              '("showcase.get_link", "showcase:write")',
              catalog,
              count=1,
          )
          if count not in {0, 1}:
              raise SystemExit('ambiguous showcase.get_link scope')
          if '("showcase.get_link", "showcase:write")' not in catalog:
              raise SystemExit('showcase.get_link was not promoted to owner scope')
          write(catalog_path, catalog)

          server_path = 'src/my_data_hub/mcp/server.py'
          server = read(server_path)
          profile_start = server.index('READER_PROFILE_TOOLS = frozenset(')
          profile_end = server.index('\n)\n\nPROVIDER_ONLY_TOOLS', profile_start)
          profile = server[profile_start:profile_end]
          profile = profile.replace('        "showcase.get_link",\n', '')
          server = server[:profile_start] + profile + server[profile_end:]
          write(server_path, server)

          runtime_path = 'src/my_data_hub/showcase/runtime.py'
          runtime = read(runtime_path)
          old = (
              '        required_scope = "showcase:write" if tool in '
              'SHOWCASE_WRITE_TOOLS else "showcase:read"'
          )
          new = (
              '        required_scope = (\n'
              '            "showcase:write"\n'
              '            if tool in SHOWCASE_WRITE_TOOLS or tool == "showcase.get_link"\n'
              '            else "showcase:read"\n'
              '        )'
          )
          if old in runtime:
              runtime = runtime.replace(old, new, 1)
          if 'tool == "showcase.get_link"' not in runtime:
              raise SystemExit('runtime full-link scope guard was not installed')
          write(runtime_path, runtime)

          compose_path = 'compose.showcase.yaml'
          compose = read(compose_path)
          compose = compose.replace(
              '${MY_DATA_HUB_SHOWCASE_MEMORY_LIMIT:-768m}',
              '${MY_DATA_HUB_SHOWCASE_MEMORY_LIMIT:-512m}',
          ).replace(
              '${MY_DATA_HUB_SHOWCASE_CPU_LIMIT:-1.50}',
              '${MY_DATA_HUB_SHOWCASE_CPU_LIMIT:-1.00}',
          ).replace(
              'size=384m,mode=700,uid=65532,gid=65532',
              'size=256m,mode=700,uid=65532,gid=65532',
          )
          write(compose_path, compose)

          env_path = '.env.example'
          env = read(env_path).rstrip() + '\n'
          additions = {
              'MY_DATA_HUB_SHOWCASE_GATEWAY_URL': '',
              'MY_DATA_HUB_SHOWCASE_GATEWAY_TOKEN_FILE': '',
              'MY_DATA_HUB_SHOWCASE_GATEWAY_TIMEOUT_SECONDS': '45',
              'MY_DATA_HUB_SHOWCASE_RUNTIME_ENV_FILE': '',
              'MY_DATA_HUB_SHOWCASE_RUNTIME_HOST': '127.0.0.1',
              'MY_DATA_HUB_SHOWCASE_RUNTIME_PORT': '8790',
              'MY_DATA_HUB_SHOWCASE_RUNTIME_TOKEN_FILE': '',
              'MY_DATA_HUB_SHOWCASE_OPERATION_JOURNAL': '',
              'MY_DATA_HUB_SHOWCASE_MAX_REQUEST_BYTES': '65536',
              'MY_DATA_HUB_SHOWCASE_SITE_TEMPLATE_DIR': '',
              'MY_DATA_HUB_SHOWCASE_SITE_DIR': '',
              'MY_DATA_HUB_SHOWCASE_IMAGE': 'my-data-hub-showcase:local',
              'MY_DATA_HUB_SHOWCASE_MEMORY_LIMIT': '512m',
              'MY_DATA_HUB_SHOWCASE_CPU_LIMIT': '1.00',
              'MY_DATA_HUB_SHOWCASE_STATE_VOLUME': 'my-data-hub-showcase-state',
              'MY_DATA_HUB_MCP_SCOPES_WITH_SHOWCASE': '',
          }
          missing = [name for name in additions if f'{name}=' not in env]
          if missing:
              env += '\n# IdeaHub Showcase: public MCP edge / private renderer split\n'
              for name in missing:
                  env += f'{name}={additions[name]}\n'
          write(env_path, env)

          # Generate the private runtime template from the actual adapter code,
          # so the example cannot silently drift away from its implementation.
          code_paths = [
              'src/my_data_hub/showcase/source.py',
              'src/my_data_hub/showcase/publisher.py',
              'src/my_data_hub/showcase/state.py',
              'src/my_data_hub/showcase/builder.py',
              'src/my_data_hub/showcase/manager.py',
              'src/my_data_hub/showcase/runtime.py',
          ]
          names: set[str] = {'MY_DATA_HUB_ARTIFACT_ROOT'}
          for path in code_paths:
              names.update(re.findall(r'MY_DATA_HUB_SHOWCASE_[A-Z0-9_]+', read(path)))
          host_only = {
              'MY_DATA_HUB_SHOWCASE_GATEWAY_URL',
              'MY_DATA_HUB_SHOWCASE_GATEWAY_TOKEN_FILE',
              'MY_DATA_HUB_SHOWCASE_GATEWAY_TIMEOUT_SECONDS',
              'MY_DATA_HUB_SHOWCASE_RUNTIME_ENV_FILE',
              'MY_DATA_HUB_SHOWCASE_IMAGE',
              'MY_DATA_HUB_SHOWCASE_MEMORY_LIMIT',
              'MY_DATA_HUB_SHOWCASE_CPU_LIMIT',
              'MY_DATA_HUB_SHOWCASE_STATE_VOLUME',
          }
          names -= host_only
          existing_values = {}
          for line in env.splitlines():
              if '=' in line and not line.lstrip().startswith('#'):
                  key, value = line.split('=', 1)
                  existing_values[key] = value
          safe_defaults = {
              'MY_DATA_HUB_ARTIFACT_ROOT': '/var/lib/my-data-hub-showcase',
              'MY_DATA_HUB_SHOWCASE_RUNTIME_HOST': '127.0.0.1',
              'MY_DATA_HUB_SHOWCASE_RUNTIME_PORT': '8790',
              'MY_DATA_HUB_SHOWCASE_MAX_REQUEST_BYTES': '65536',
              'MY_DATA_HUB_SHOWCASE_SITE_TEMPLATE_DIR': '/opt/showcase-site',
              'MY_DATA_HUB_SHOWCASE_SITE_DIR': '/work/showcase-site',
              'MY_DATA_HUB_SHOWCASE_OPERATION_JOURNAL': '/var/lib/my-data-hub-showcase/showcase-operations.json',
          }
          lines = [
              '# Private environment for the isolated my-data-hub showcase runtime.',
              '# Copy outside the repository, chmod 0600, and fill all adapter secrets.',
              '# Never pass this file to remote-mcp.',
              '',
          ]
          for name in sorted(names):
              value = safe_defaults.get(name, existing_values.get(name, ''))
              if any(marker in name for marker in ('TOKEN', 'SECRET', 'KEY', 'PASSWORD', 'CREDENTIAL')):
                  value = ''
              lines.append(f'{name}={value}')
          lines.append('')
          write('deploy/showcase-runtime/runtime.env.example', '\n'.join(lines))
          PY

      - name: Write deployment runbook and drift tests
        run: |
          mkdir -p docs/operations tests/showcase
          cat > docs/operations/ideahub-showcase-runtime.md <<'EOF'
          # IdeaHub Showcase: production runtime

          ## Ownership boundary

          `onedayonemasterpiece/idea-hub` is the curated source of cards, audience views,
          source references and visual decisions. It does not execute Astro, publish files,
          store active secret links or expose MCP tools.

          `onedayonemasterpiece/my-data-hub` owns the complete display runtime:

          ```text
          MCP client
            -> OAuth remote-mcp edge (Python only; no GitHub/publisher credentials)
            -> authenticated loopback showcase gateway
            -> isolated showcase-runtime (GitHub source + Astro + publisher + private state)
          ```

          The standard `remote-mcp` image stays Python-only. Node, the read-only source
          credential and the publication credential exist only in `showcase-runtime`.

          ## One-time host inputs

          Create two files outside the repository:

          1. A distinct random gateway token, readable only by UID/GID `65532`:

             ```bash
             sudo install -d -o 65532 -g 65532 -m 0700 /srv/my-data-hub/showcase
             openssl rand -base64 48 | tr -d '\n' | \
               sudo tee /srv/my-data-hub/showcase/gateway.key >/dev/null
             sudo chown 65532:65532 /srv/my-data-hub/showcase/gateway.key
             sudo chmod 0600 /srv/my-data-hub/showcase/gateway.key
             ```

          2. A private runtime env copied from
             `deploy/showcase-runtime/runtime.env.example`, also mode `0600` and owned by
             `65532:65532`. It contains the existing read-only `idea-hub` source adapter
             configuration and the selected publisher adapter configuration. Do not put
             these values in the Compose file or the `remote-mcp` environment.

          Set the host-side overlay variables in the existing deployment env:

          ```dotenv
          MY_DATA_HUB_SHOWCASE_GATEWAY_TOKEN_FILE=/srv/my-data-hub/showcase/gateway.key
          MY_DATA_HUB_SHOWCASE_RUNTIME_ENV_FILE=/srv/my-data-hub/showcase/runtime.env
          MY_DATA_HUB_SHOWCASE_RUNTIME_PORT=8790
          MY_DATA_HUB_SHOWCASE_IMAGE=my-data-hub-showcase:local
          MY_DATA_HUB_SHOWCASE_MEMORY_LIMIT=512m
          MY_DATA_HUB_SHOWCASE_CPU_LIMIT=1.00
          MY_DATA_HUB_SHOWCASE_STATE_VOLUME=my-data-hub-showcase-state
          MY_DATA_HUB_MCP_SCOPES_WITH_SHOWCASE=<existing-owner-scopes>,showcase:read,showcase:write
          ```

          The OAuth owner/operator client must be allowed to receive `showcase:read` and
          `showcase:write`. A generic reader may receive only `showcase:read`; it can list
          masked surfaces but cannot retrieve a full secret URL. `showcase.get_link` is an
          owner/operator capability even though the tool remains annotated read-only.

          ## Build and start

          From the exact verified `my-data-hub` commit:

          ```bash
          docker compose \
            -f compose.control-plane.yaml \
            -f compose.showcase.yaml \
            --env-file /srv/my-data-hub/control-plane.env \
            build showcase-runtime

          docker compose \
            -f compose.control-plane.yaml \
            -f compose.showcase.yaml \
            --env-file /srv/my-data-hub/control-plane.env \
            up -d showcase-runtime remote-mcp
          ```

          The private runtime must answer only on loopback:

          ```bash
          curl --fail --silent http://127.0.0.1:8790/health/ready
          ```

          Do not expose port `8790` in Nginx, Cloudflare Tunnel or a Docker published-port
          rule. The service token is a process-to-process credential, not a user token.

          ## Required live acceptance

          Use unique idempotency keys containing the source commit. Perform, in order:

          ```text
          showcase.create_view(view_id="main", idempotency_key="create:main:<source-sha>")
          showcase.get_link(view_id="main")
          showcase.rebuild(view_id="main", idempotency_key="rebuild:main:<source-sha>")
          showcase.get_link(view_id="main")          # URL must be unchanged
          showcase.rotate_link(view_id="main", idempotency_key="rotate:main:<source-sha>:1")
          showcase.get_link(view_id="main")          # new URL
          verify old URL is unavailable
          showcase.revoke_link(view_id="main", idempotency_key="revoke:main:<source-sha>:1")
          verify current URL is unavailable
          ```

          Save the deployed `my-data-hub` commit, exact `idea-hub` source commit, build
          receipt, publisher receipt, masked URL, HTTP checks and rotation/revocation
          checks in an operations receipt. Never persist a full secret URL in ordinary
          logs or GitHub.

          ## Failure and rollback

          Write operations are idempotent. Link rotation records old/new slugs before the
          switch and persists active state before revoking the old path; retrying the same
          idempotency key completes an interrupted rotation without creating a third URL.

          To disable only this feature while preserving recovery metadata:

          ```bash
          docker compose \
            -f compose.control-plane.yaml \
            -f compose.showcase.yaml \
            --env-file /srv/my-data-hub/control-plane.env \
            stop showcase-runtime
          ```

          Restart `remote-mcp` without `compose.showcase.yaml` and without showcase scopes.
          Preserve the named state volume until all active URLs have been explicitly
          revoked or migrated.

          This runtime requires neither PostgreSQL nor Kaggle. It adds one small bounded
          container beside the existing control plane.
          EOF

          cat > tests/showcase/test_env_contract_v2.py <<'PY'
          from __future__ import annotations

          import re
          from pathlib import Path

          import yaml

          ROOT = Path(__file__).resolve().parents[2]


          def test_every_showcase_environment_name_is_documented() -> None:
              code = "\n".join(
                  path.read_text(encoding="utf-8")
                  for path in (ROOT / "src/my_data_hub/showcase").glob("*.py")
              )
              used = set(re.findall(r"MY_DATA_HUB_SHOWCASE_[A-Z0-9_]+", code))
              documented = "\n".join(
                  [
                      (ROOT / ".env.example").read_text(encoding="utf-8"),
                      (ROOT / "deploy/showcase-runtime/runtime.env.example").read_text(
                          encoding="utf-8"
                      ),
                      (ROOT / "compose.showcase.yaml").read_text(encoding="utf-8"),
                      (ROOT / "docs/operations/ideahub-showcase-runtime.md").read_text(
                          encoding="utf-8"
                      ),
                  ]
              )
              missing = sorted(name for name in used if name not in documented)
              assert missing == []


          def test_loopback_gateway_matches_existing_control_plane_network_mode() -> None:
              base = yaml.safe_load(
                  (ROOT / "compose.control-plane.yaml").read_text(encoding="utf-8")
              )
              overlay = yaml.safe_load(
                  (ROOT / "compose.showcase.yaml").read_text(encoding="utf-8")
              )
              assert base["services"]["remote-mcp"]["network_mode"] == "host"
              remote = overlay["services"]["remote-mcp"]
              assert remote["environment"]["MY_DATA_HUB_SHOWCASE_GATEWAY_URL"].startswith(
                  "http://127.0.0.1:"
              )
              assert "ports" not in overlay["services"]["showcase-runtime"]
              assert overlay["services"]["showcase-runtime"]["network_mode"] == "host"


          def test_full_link_tool_is_not_in_reader_profile() -> None:
              server = (ROOT / "src/my_data_hub/mcp/server.py").read_text(encoding="utf-8")
              start = server.index("READER_PROFILE_TOOLS = frozenset(")
              end = server.index("\n)\n\nPROVIDER_ONLY_TOOLS", start)
              profile = server[start:end]
              assert '"showcase.list"' in profile
              assert '"showcase.get_link"' not in profile

              catalog = (ROOT / "src/my_data_hub/mcp/catalog.py").read_text(
                  encoding="utf-8"
              )
              assert '("showcase.get_link", "showcase:write")' in catalog
          PY

          cat >> tests/showcase/test_runtime_v2.py <<'PY'


          def test_full_link_requires_owner_write_scope(tmp_path: Path) -> None:
              manager = FakeManager()
              app = create_app(
                  controller=ShowcaseOperationController(
                      manager,
                      ShowcaseOperationJournal(tmp_path / "operations.json"),
                  ),
                  token=TOKEN,
              )
              client = TestClient(app)
              body = {
                  "tool": "showcase.get_link",
                  "arguments": {"view_id": "main"},
                  "principal": principal("showcase:read").model_dump(),
              }
              headers = {"Authorization": f"Bearer {TOKEN}"}
              assert client.post(
                  "/internal/mcp-showcase/invoke", headers=headers, json=body
              ).status_code == 403
              body["principal"] = principal("showcase:write").model_dump()
              response = client.post(
                  "/internal/mcp-showcase/invoke", headers=headers, json=body
              )
              assert response.status_code == 200
              assert response.json()["result"]["url"].endswith(f"/{OLD_SLUG}/")
          PY

      - name: Install and format
        run: |
          python -m pip install -e '.[dev]'
          npm ci --prefix showcase-site --no-audit --no-fund
          ruff check --fix \
            src/my_data_hub/mcp/catalog.py \
            src/my_data_hub/mcp/server.py \
            src/my_data_hub/showcase/runtime.py \
            tests/showcase/test_runtime_v2.py \
            tests/showcase/test_env_contract_v2.py
          ruff format \
            src/my_data_hub/mcp/catalog.py \
            src/my_data_hub/mcp/server.py \
            src/my_data_hub/showcase/runtime.py \
            tests/showcase/test_runtime_v2.py \
            tests/showcase/test_env_contract_v2.py

      - name: Verify final product and regressions
        run: |
          ruff check \
            src/my_data_hub/showcase \
            src/my_data_hub/mcp/server.py \
            src/my_data_hub/mcp/catalog.py \
            src/my_data_hub/config.py \
            tests/showcase
          pytest -q \
            tests/showcase \
            tests/test_mcp_sdk_v2_contract.py \
            tests/test_config.py \
            tests/test_control_plane_deployment.py
          if npm run --prefix showcase-site | grep -q 'test:all'; then
            npm run --prefix showcase-site test:all
          elif npm run --prefix showcase-site | grep -q 'test:build'; then
            npm run --prefix showcase-site test:build
          else
            npm run --prefix showcase-site build
          fi
          docker build -f deploy/showcase-runtime/Dockerfile -t my-data-hub-showcase:final-check .
          python -m compileall -q src tests/showcase
          git diff --check

      - name: Update verification receipt and remove one-shot workflow
        run: |
          cat >> docs/operations/showcase-runtime-v2-verification.md <<EOF

          ## Production-contract hardening

          - workflow_run: ${GITHUB_RUN_ID}
          - workflow_attempt: ${GITHUB_RUN_ATTEMPT}
          - source_commit: ${GITHUB_SHA}
          - verified_at_utc: $(date -u +%Y-%m-%dT%H:%M:%SZ)
          - full_secret_link_owner_scope: PASS
          - environment_inventory_drift_test: PASS
          - loopback_topology_contract: PASS
          - reduced_default_resource_budget: PASS
          - deployment_runbook: PASS
          - final_runtime_image: PASS
          EOF
          rm -f .github/workflows/finalize-showcase-production-contract.yml

      - name: Commit final deployment-ready source
        run: |
          git add -A
          git commit -m "feat: finalize IdeaHub Showcase production contract"
          git push origin HEAD:main
