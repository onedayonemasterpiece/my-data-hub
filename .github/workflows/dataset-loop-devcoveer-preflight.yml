name: dataset-loop-devcoveer-preflight

on:
  push:
    branches: [preflight/dataset-loop-devcoveer-20260903]
    paths:
      - ".preflight/dataset-loop-devcoveer.json"

permissions:
  contents: read

concurrency:
  group: dataset-loop-devcoveer-preflight
  cancel-in-progress: false

jobs:
  read-only-host-preflight:
    runs-on: [self-hosted, linux, my-data-hub-devstand]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preflight/dataset-loop-devcoveer-20260903
          fetch-depth: 1

      - name: Collect bounded secret-free host evidence
        shell: bash
        run: |
          set -euo pipefail
          set +x
          python3 - <<'PY'
          from __future__ import annotations

          import datetime as dt
          import json
          import os
          import pathlib
          import shutil
          import socket
          import subprocess
          from typing import Any

          out = pathlib.Path(os.environ["RUNNER_TEMP"]) / "dataset-loop-devcoveer-preflight.json"

          def run(argv: list[str], timeout: int = 10) -> dict[str, Any]:
              try:
                  cp = subprocess.run(
                      argv,
                      text=True,
                      capture_output=True,
                      timeout=timeout,
                      check=False,
                      env={"PATH": os.environ.get("PATH", "")},
                  )
                  return {
                      "returncode": cp.returncode,
                      "stdout": cp.stdout.strip()[:4000],
                      "stderr": cp.stderr.strip()[:1000],
                  }
              except Exception as exc:
                  return {"error": type(exc).__name__, "detail": str(exc)[:500]}

          def command_version(name: str, args: list[str]) -> dict[str, Any]:
              path = shutil.which(name)
              result: dict[str, Any] = {"present": path is not None, "path": path}
              if path:
                  probe = run([path, *args])
                  combined = (probe.get("stdout", "") + "\n" + probe.get("stderr", "")).strip()
                  result["version"] = combined.splitlines()[0][:300] if combined else None
                  result["returncode"] = probe.get("returncode")
              return result

          def path_state(value: str) -> dict[str, Any]:
              path = pathlib.Path(value).expanduser()
              result: dict[str, Any] = {"path": str(path), "exists": path.exists()}
              if path.exists():
                  stat = path.stat()
                  result.update(
                      {
                          "kind": "directory" if path.is_dir() else "file",
                          "mode": oct(stat.st_mode & 0o777),
                          "uid": stat.st_uid,
                          "gid": stat.st_gid,
                      }
                  )
              return result

          def dns_v4(host: str) -> dict[str, Any]:
              try:
                  values = sorted(
                      {
                          item[4][0]
                          for item in socket.getaddrinfo(host, 443, socket.AF_INET, socket.SOCK_STREAM)
                      }
                  )
                  return {"resolved": True, "addresses": values}
              except Exception as exc:
                  return {"resolved": False, "error": type(exc).__name__, "detail": str(exc)[:300]}

          def http_probe(url: str) -> dict[str, Any]:
              curl = shutil.which("curl")
              if not curl:
                  return {"error": "curl_missing"}
              probe = run(
                  [
                      curl,
                      "--silent",
                      "--show-error",
                      "--max-time",
                      "10",
                      "--output",
                      "/dev/null",
                      "--write-out",
                      "http=%{http_code};remote=%{remote_ip};ssl=%{ssl_verify_result};redirect=%{redirect_url}",
                      url,
                  ],
                  timeout=15,
              )
              return {
                  "returncode": probe.get("returncode"),
                  "result": probe.get("stdout", ""),
                  "error": probe.get("stderr", "")[:500],
              }

          def unit_names(scope: list[str]) -> dict[str, Any]:
              probe = run([*scope, "--no-pager", "--plain", "--type=service", "--state=running"], timeout=15)
              names: list[str] = []
              for line in probe.get("stdout", "").splitlines():
                  token = line.strip().split(maxsplit=1)[0] if line.strip() else ""
                  lowered = token.lower()
                  if token.endswith(".service") and any(
                      key in lowered
                      for key in ("my-data", "nginx", "xray", "certbot", "runner", "dataset-loop")
                  ):
                      names.append(token)
              return {"returncode": probe.get("returncode"), "units": sorted(set(names)), "error": probe.get("stderr", "")[:500]}

          candidate_ports: dict[str, str] = {}
          for port in range(8790, 8811):
              sock = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
              try:
                  sock.bind(("127.0.0.1", port))
                  candidate_ports[str(port)] = "bindable"
              except OSError as exc:
                  candidate_ports[str(port)] = f"occupied_or_denied:{exc.errno}"
              finally:
                  sock.close()

          listeners_probe = run([shutil.which("ss") or "ss", "-H", "-ltn"], timeout=10)
          relevant_listeners: list[str] = []
          for line in listeners_probe.get("stdout", "").splitlines():
              if any(f":{port}" in line for port in (443, 8080, 8444, 8765, 8780, 10443, 1443)):
                  relevant_listeners.append(" ".join(line.split())[:500])

          df = run([shutil.which("df") or "df", "-B1", "--output=avail", "/"])
          mem_available = None
          try:
              for line in pathlib.Path("/proc/meminfo").read_text().splitlines():
                  if line.startswith("MemAvailable:"):
                      mem_available = line.split(":", 1)[1].strip()
                      break
          except OSError:
              pass

          hosts = [
              "mcp.kenigevents.ru",
              "mcp-datahub.kenigevents.ru",
              "identity.kenigevents.ru",
              "mcp-dataset-loop.kenigevents.ru",
          ]

          evidence = {
              "schema_version": 1,
              "captured_at": dt.datetime.now(dt.UTC).isoformat(),
              "side_effects": "none_persistent; candidate ports were bound and immediately released",
              "runner": {
                  "hostname": socket.gethostname(),
                  "user": run(["id", "-un"]).get("stdout"),
                  "uid": os.getuid(),
                  "gid": os.getgid(),
                  "kernel": run(["uname", "-srmo"]).get("stdout"),
                  "root_available_bytes": df.get("stdout", "").splitlines()[-1].strip() if df.get("stdout") else None,
                  "mem_available": mem_available,
                  "github_workspace_repo": os.environ.get("GITHUB_REPOSITORY"),
                  "github_sha": os.environ.get("GITHUB_SHA"),
              },
              "commands": {
                  "python3": command_version("python3", ["--version"]),
                  "git": command_version("git", ["--version"]),
                  "docker": command_version("docker", ["--version"]),
                  "uv": command_version("uv", ["--version"]),
                  "kaggle": command_version("kaggle", ["--version"]),
                  "nginx": command_version("nginx", ["-v"]),
                  "certbot": command_version("certbot", ["--version"]),
                  "xray": command_version("xray", ["version"]),
                  "systemctl": command_version("systemctl", ["--version"]),
              },
              "known_paths": {
                  "kaggle_absolute": path_state("/usr/local/bin/kaggle"),
                  "kaggle_credential": path_state("~/.kaggle/kaggle.json"),
                  "dataset_loop_state": path_state("/var/lib/dataset-loop-mcp"),
                  "dataset_loop_connection_file": path_state("/var/lib/dataset-loop-mcp/owner-connection.json"),
                  "user_systemd": path_state("~/.config/systemd/user"),
              },
              "network": {
                  "relevant_listeners": relevant_listeners,
                  "candidate_loopback_ports": candidate_ports,
                  "dns_v4": {host: dns_v4(host) for host in hosts},
                  "https": {
                      "events_mcp": http_probe("https://mcp.kenigevents.ru/mcp"),
                      "datahub_mcp": http_probe("https://mcp-datahub.kenigevents.ru/mcp"),
                      "identity": http_probe("https://identity.kenigevents.ru/.well-known/openid-configuration"),
                      "planned_dataset_loop_health": http_probe("https://mcp-dataset-loop.kenigevents.ru/health"),
                  },
              },
              "services": {
                  "user_running": unit_names(["systemctl", "--user"]),
                  "system_running": unit_names(["systemctl"]),
              },
          }

          out.write_text(json.dumps(evidence, indent=2, sort_keys=True) + "\n")
          print(f"wrote {out.name}; bytes={out.stat().st_size}")
          PY

      - name: Upload secret-free preflight evidence
        uses: actions/upload-artifact@v4
        with:
          name: dataset-loop-devcoveer-preflight
          path: ${{ runner.temp }}/dataset-loop-devcoveer-preflight.json
          if-no-files-found: error
          retention-days: 3
