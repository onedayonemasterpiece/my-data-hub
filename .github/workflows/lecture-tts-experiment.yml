name: Lecture TTS experiment

on:
  push:
    branches:
      - work/lecture-tts-20260915
  workflow_dispatch:

jobs:
  tts:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      HF_HOME: /tmp/huggingface
      TOKENIZERS_PARALLELISM: "false"
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
      NUMEXPR_NUM_THREADS: "4"
    steps:
      - uses: actions/checkout@v4

      - name: Runner diagnostics
        run: |
          uname -a
          nproc
          free -h
          df -h
          python3 --version

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg and CPU TTS runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir --index-url https://download.pytorch.org/whl/cpu torch==2.6.0 torchvision==0.21.0 torchaudio==2.6.0
          python -m pip install --no-cache-dir --force-reinstall numpy==1.26.4 scipy==1.11.4
          python -m pip install --no-cache-dir qwen-tts==0.1.1 soundfile==0.13.1
          python -m pip install --no-cache-dir --force-reinstall numpy==1.26.4 scipy==1.11.4

      - name: Select safe CPU dtype
        run: |
          mem_kb=$(awk '/MemTotal/ {print $2}' /proc/meminfo)
          echo "MemTotal kB: $mem_kb"
          if [ "$mem_kb" -lt 12000000 ]; then
            echo "TTS_DTYPE=bfloat16" >> "$GITHUB_ENV"
          else
            echo "TTS_DTYPE=float32" >> "$GITHUB_ENV"
          fi

      - name: Restore slide-only narration JSON
        run: |
          python - <<'PY'
          import base64, hashlib, zlib
          from pathlib import Path
          d = Path('experiments/lecture-tts-20260915')
          raw = ''.join((d / f'script.part{i}.b64').read_text(encoding='utf-8').strip() for i in range(1, 5))
          out = zlib.decompress(base64.b64decode(raw))
          expected = 'ef5e1b65ab2d61849b24227b666a4148a59854e3106cf560d70913b1e643ff1a'
          actual = hashlib.sha256(out).hexdigest()
          print('compressed chars', len(raw), 'script bytes', len(out), 'sha256', actual)
          assert actual == expected, (actual, expected)
          (d / 'lecture_script.json').write_bytes(out)
          PY

      - name: Prepare local voice reference
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, shutil
          d = Path('experiments/lecture-tts-20260915')
          src = d / 'reference_kazakova_10s.ogg'
          assert src.is_file(), src
          expected = 'bd92c7a4343e2e07256942bb036d7db9ef885eda5985109f140849ce081ccf5a'
          actual = hashlib.sha256(src.read_bytes()).hexdigest()
          print('voice reference bytes', src.stat().st_size, 'sha256', actual)
          assert actual == expected, (actual, expected)
          dst = Path('audio_2026-09-02_15-37-11-kazakova.ogg')
          shutil.copyfile(src, dst)
          gen = d / 'run_longform.py'
          text = gen.read_text(encoding='utf-8')
          text = text.replace(
              'EXPECTED_SOURCE_SHA256 = "4a4d1732ae7a5b6ed7564639196665b512381b76ef72417896d8638caad27228"',
              'EXPECTED_SOURCE_SHA256 = "bd92c7a4343e2e07256942bb036d7db9ef885eda5985109f140849ce081ccf5a"',
          )
          gen.write_text(text, encoding='utf-8')
          PY

      - name: Validate generator syntax
        run: |
          python experiments/lecture-tts-20260915/fix_generator.py experiments/lecture-tts-20260915/run_longform.py

      - name: Synthesize lecture MP3
        run: |
          python experiments/lecture-tts-20260915/run_longform.py run \
            --script experiments/lecture-tts-20260915/lecture_script.json \
            --workdir experiments/lecture-tts-20260915/tts_out \
            --output lecture_computer_in_cube.mp3

      - name: Final output summary
        if: ${{ always() }}
        run: |
          find experiments/lecture-tts-20260915/tts_out -maxdepth 2 -type f -printf '%p %s bytes\n' 2>/dev/null | sort || true
          if [ -f experiments/lecture-tts-20260915/tts_out/manifest.json ]; then cat experiments/lecture-tts-20260915/tts_out/manifest.json; fi

      - name: Upload TTS artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: lecture-tts-computer-in-cube
          path: experiments/lecture-tts-20260915/tts_out
          if-no-files-found: warn
          retention-days: 7
