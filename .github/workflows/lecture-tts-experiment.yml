name: Lecture TTS experiment

on:
  push:
    branches:
      - work/lecture-tts-20260915
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthesize:
    name: synthesize shard ${{ matrix.shard }}
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      HF_HOME: /tmp/huggingface
      TOKENIZERS_PARALLELISM: "false"
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
      NUMEXPR_NUM_THREADS: "4"
      TTS_DTYPE: float32
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Runner diagnostics
        run: |
          uname -a
          nproc
          free -h
          df -h
          python --version

      - name: Install CPU TTS runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir --index-url https://download.pytorch.org/whl/cpu torch==2.6.0 torchvision==0.21.0 torchaudio==2.6.0
          python -m pip install --no-cache-dir --force-reinstall numpy==1.26.4 scipy==1.11.4
          python -m pip install --no-cache-dir qwen-tts==0.1.1 soundfile==0.13.1
          python -m pip install --no-cache-dir --force-reinstall numpy==1.26.4 scipy==1.11.4

      - name: Reconstruct exact inputs
        run: |
          python - <<'PY'
          import base64, hashlib, zlib
          from pathlib import Path
          d = Path('experiments/lecture-tts-20260915')

          script_raw = ''.join((d / f'script.part{i}.b64').read_text(encoding='utf-8').strip() for i in range(1, 5))
          script = zlib.decompress(base64.b64decode(script_raw))
          script_sha = hashlib.sha256(script).hexdigest()
          assert script_sha == 'ef5e1b65ab2d61849b24227b666a4148a59854e3106cf560d70913b1e643ff1a', script_sha
          (d / 'lecture_script.json').write_bytes(script)

          ref_raw = ''.join((d / f'reference.part{i}.b64').read_text(encoding='utf-8').strip() for i in range(1, 7))
          reference = base64.b64decode(ref_raw)
          ref_sha = hashlib.sha256(reference).hexdigest()
          assert ref_sha == 'bd92c7a4343e2e07256942bb036d7db9ef885eda5985109f140849ce081ccf5a', ref_sha
          (d / 'reference_kazakova_10s_exact.ogg').write_bytes(reference)
          print('script', len(script), script_sha)
          print('reference', len(reference), ref_sha)
          PY

      - name: Validate generator syntax
        run: python -m py_compile experiments/lecture-tts-20260915/longform_shard.py

      - name: Synthesize shard
        run: |
          python experiments/lecture-tts-20260915/longform_shard.py \
            --script experiments/lecture-tts-20260915/lecture_script.json \
            --reference experiments/lecture-tts-20260915/reference_kazakova_10s_exact.ogg \
            --output-dir experiments/lecture-tts-20260915/tts_shard_${{ matrix.shard }} \
            --shard-index ${{ matrix.shard }} \
            --shard-count 6

      - name: Upload shard
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: lecture-tts-shard-${{ matrix.shard }}
          path: experiments/lecture-tts-20260915/tts_shard_${{ matrix.shard }}
          if-no-files-found: error
          retention-days: 7

  assemble:
    name: assemble final MP3
    needs: synthesize
    if: ${{ success() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Download all shards
        uses: actions/download-artifact@v4
        with:
          pattern: lecture-tts-shard-*
          path: experiments/lecture-tts-20260915/tts_all
          merge-multiple: true

      - name: Assemble and verify MP3
        run: |
          python experiments/lecture-tts-20260915/assemble_longform.py \
            --input-dir experiments/lecture-tts-20260915/tts_all \
            --output experiments/lecture-tts-20260915/final/lecture_computer_in_cube.mp3 \
            --expected-chunks 53

      - name: Upload final MP3
        uses: actions/upload-artifact@v4
        with:
          name: lecture-tts-computer-in-cube-final
          path: |
            experiments/lecture-tts-20260915/final/lecture_computer_in_cube.mp3
            experiments/lecture-tts-20260915/final/final-manifest.json
          if-no-files-found: error
          retention-days: 7
