name: provider-real

on:
  workflow_dispatch:
    inputs:
      acceptance_mode:
        description: Scheduled acceptance scenario
        required: true
        default: weekly
        type: choice
        options:
          - weekly
          - manual
  schedule:
    - cron: '17 3 * * 2'

permissions:
  contents: read

concurrency:
  group: my-data-hub-real-kaggle
  cancel-in-progress: false

jobs:
  private-notebook-canary:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
      # This is a JSON argv array, not a shell command.  The referenced trusted
      # executable owns real master/import/embed/MCP/host fault actions and
      # must return an exact Kaggle run locator or a typed BLOCKED dependency.
      MY_DATA_HUB_OPERATIONAL_DRIVER_JSON: ${{ vars.MY_DATA_HUB_OPERATIONAL_DRIVER_JSON || '["python","scripts/provider/operational_kaggle_driver.py"]' }}
      MY_DATA_HUB_MCP_CANARY_ENDPOINT: ${{ vars.MY_DATA_HUB_MCP_CANARY_ENDPOINT || 'https://mcp-datahub.kenigevents.ru/mcp' }}
      MY_DATA_HUB_MCP_CANARY_TOKEN: ${{ secrets.MY_DATA_HUB_MCP_CANARY_TOKEN }}
      MY_DATA_HUB_MCP_ACCEPTANCE_OPERATOR_TOKEN: ${{ secrets.MY_DATA_HUB_MCP_ACCEPTANCE_OPERATOR_TOKEN }}
      MY_DATA_HUB_MCP_MIGRATION_OPERATOR_TOKEN: ${{ secrets.MY_DATA_HUB_MCP_MIGRATION_OPERATOR_TOKEN }}
      MY_DATA_HUB_MCP_PROVIDER_OPERATOR_TOKEN: ${{ secrets.MY_DATA_HUB_MCP_PROVIDER_OPERATOR_TOKEN }}
      # Non-secret exact claims for already-running disposable FM06/FM13
      # evidence Notebooks.  The driver re-reads each claim through the
      # provider MCP before it can request a restore or rotation.
      MY_DATA_HUB_OPERATIONAL_EVIDENCE_CLAIMS_JSON: ${{ vars.MY_DATA_HUB_OPERATIONAL_EVIDENCE_CLAIMS_JSON }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e '.[dev,kaggle]'
      - name: Preflight exact operational interface before mutation
        continue-on-error: true
        run: python scripts/provider/operational_kaggle_matrix.py preflight
      - name: Run or emit typed blockers for the 24-scenario operational matrix
        if: always()
        run: >-
          python scripts/provider/operational_kaggle_matrix.py run
          --ledger artifacts/operational-provider-effects.sqlite3
          --receipt artifacts/operational-kaggle-matrix.json
          --scenario-receipts artifacts/operational-kaggle-scenarios
          --plan artifacts/operational-kaggle-plan.json
      - name: Run weekly/manual scheduled acceptance
        if: always()
        env:
          MY_DATA_HUB_MCP_CANARY_ENDPOINT: ${{ vars.MY_DATA_HUB_MCP_CANARY_ENDPOINT || 'https://mcp-datahub.kenigevents.ru/mcp' }}
          MY_DATA_HUB_MCP_CANARY_TOKEN: ${{ secrets.MY_DATA_HUB_MCP_CANARY_TOKEN }}
          MY_DATA_HUB_MCP_ACCEPTANCE_OPERATOR_TOKEN: ${{ secrets.MY_DATA_HUB_MCP_ACCEPTANCE_OPERATOR_TOKEN }}
          MY_DATA_HUB_EXPECTED_DEPLOY_COMMIT: ${{ vars.MY_DATA_HUB_EXPECTED_DEPLOY_COMMIT }}
          ACCEPTANCE_MODE: ${{ github.event_name == 'schedule' && 'weekly' || inputs.acceptance_mode }}
        run: >-
          python scripts/provider/scheduled_acceptance.py run
          --mode "$ACCEPTANCE_MODE"
          --ledger artifacts/scheduled-provider-effects.sqlite3
          --dataset-lifecycle-receipt artifacts/dataset-canary.json
          --notebook-lifecycle-receipt artifacts/notebook-canary.json
          --receipt artifacts/scheduled-provider-real.json
      - name: Upload non-secret exact-run receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: provider-real-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/operational-kaggle-matrix.json
            artifacts/operational-kaggle-plan.json
            artifacts/operational-kaggle-scenarios/
            artifacts/scheduled-provider-real.json
          if-no-files-found: error
          retention-days: 30
