name: provider-real

on:
  workflow_dispatch:
    inputs:
      acceptance_mode:
        description: Scheduled acceptance scenario
        required: true
        default: weekly
        type: choice
        options:
          - weekly
          - manual
  schedule:
    - cron: '17 3 * * 2'

permissions:
  contents: read

concurrency:
  group: my-data-hub-real-kaggle
  cancel-in-progress: false

jobs:
  private-notebook-canary:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e '.[dev,kaggle]'
      - name: Require modern Kaggle token
        run: python scripts/provider/real_kaggle_matrix.py preflight
      - name: Run distinct private generated-Notebook scenario matrix
        run: >-
          python scripts/provider/real_kaggle_matrix.py matrix
          --ledger artifacts/provider-matrix-effects.sqlite3
          --receipt artifacts/kaggle-matrix.json
          --scenario-receipts artifacts/kaggle-matrix-scenarios
          --plan artifacts/kaggle-matrix-plan.json
      - name: Run private exact-version dataset canary
        run: >-
          python scripts/provider/real_kaggle_matrix.py dataset-canary
          --ledger artifacts/provider-effects.sqlite3
          --receipt artifacts/dataset-canary.json
      - name: Run private exact-source notebook canary
        run: >-
          python scripts/provider/real_kaggle_matrix.py notebook-canary
          --ledger artifacts/provider-effects.sqlite3
          --receipt artifacts/notebook-canary.json
      - name: Run weekly/manual scheduled acceptance
        if: always()
        env:
          MY_DATA_HUB_MCP_CANARY_ENDPOINT: ${{ vars.MY_DATA_HUB_MCP_CANARY_ENDPOINT || 'https://mcp-datahub.kenigevents.ru/mcp' }}
          MY_DATA_HUB_MCP_CANARY_TOKEN: ${{ secrets.MY_DATA_HUB_MCP_CANARY_TOKEN }}
          MY_DATA_HUB_MCP_ACCEPTANCE_OPERATOR_TOKEN: ${{ secrets.MY_DATA_HUB_MCP_ACCEPTANCE_OPERATOR_TOKEN }}
          MY_DATA_HUB_EXPECTED_DEPLOY_COMMIT: ${{ vars.MY_DATA_HUB_EXPECTED_DEPLOY_COMMIT }}
          ACCEPTANCE_MODE: ${{ github.event_name == 'schedule' && 'weekly' || inputs.acceptance_mode }}
        run: >-
          python scripts/provider/scheduled_acceptance.py run
          --mode "$ACCEPTANCE_MODE"
          --ledger artifacts/scheduled-provider-effects.sqlite3
          --dataset-lifecycle-receipt artifacts/dataset-canary.json
          --notebook-lifecycle-receipt artifacts/notebook-canary.json
          --receipt artifacts/scheduled-provider-real.json
      - name: Upload non-secret exact-run receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: provider-real-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/dataset-canary.json
            artifacts/notebook-canary.json
            artifacts/kaggle-matrix.json
            artifacts/kaggle-matrix-plan.json
            artifacts/kaggle-matrix-scenarios/
            artifacts/scheduled-provider-real.json
          if-no-files-found: error
          retention-days: 30
