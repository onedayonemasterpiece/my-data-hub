name: restore-drill

on:
  schedule:
    - cron: '17 4 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: isolated-restore-drill
  cancel-in-progress: false

jobs:
  isolated-restore:
    runs-on: [self-hosted, linux, recovery]
    environment: recovery-drill
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Preflight recovery runner
        run: test -x /opt/my-data-hub/bin/run-isolated-restore-drill
      - name: Run isolated restore through protected self-host boundary
        run: /opt/my-data-hub/bin/run-isolated-restore-drill
      - name: Validate recovery receipt
        run: |
          test -f artifacts/recovery-receipt.json
          python - <<'PY'
          import hashlib, json
          from jsonschema import Draft202012Validator, FormatChecker
          schema=json.load(open('schemas/recovery-receipt.v1.schema.json'))
          receipt=json.load(open('artifacts/recovery-receipt.json'))
          Draft202012Validator(schema, format_checker=FormatChecker()).validate(receipt)
          unsigned={key:value for key,value in receipt.items() if key != 'receipt_sha256'}
          encoded=json.dumps(unsigned, ensure_ascii=False, sort_keys=True, separators=(',', ':')).encode()
          assert receipt['receipt_sha256'] == hashlib.sha256(encoded).hexdigest()
          PY
      - name: Write workflow receipt
        if: always()
        run: |
          outcome=PASS; observed="isolated restore and receipt validation passed"; cleanup=complete
          if [[ "${{ job.status }}" != success ]]; then outcome=FAIL; observed="restore drill failed or was not configured"; cleanup=failed; fi
          python scripts/write_workflow_receipt.py --workflow restore-drill --environment recovery-drill \
            --outcome "$outcome" --observed "$observed" --cleanup "$cleanup" \
            --output artifacts/restore-drill-workflow-receipt.json
      - name: Upload restore receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: restore-drill-receipts-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/*receipt.json
          if-no-files-found: error
