name: dataset-loop-mcp-runner-probe

on:
  push:
    branches: [main]
    paths:
      - "ops/dataset-loop-mcp/runner-probe-request.json"

permissions:
  contents: write

concurrency:
  group: dataset-loop-mcp-deployment
  cancel-in-progress: false

jobs:
  probe:
    runs-on: [self-hosted, linux, my-data-hub-devstand]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Probe the actual DevCoveer runner and private prerelease
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import os
          import pathlib
          import shutil
          import socket
          import stat
          import subprocess
          from datetime import UTC, datetime

          root = pathlib.Path.cwd().resolve()
          home = pathlib.Path.home().resolve()
          temp = pathlib.Path(os.environ["RUNNER_TEMP"])

          def run(argv: list[str], *, host_auth: bool = False, timeout: int = 30) -> tuple[int, str]:
              env = os.environ.copy()
              if host_auth:
                  env.pop("GH_TOKEN", None)
                  env.pop("GITHUB_TOKEN", None)
              try:
                  result = subprocess.run(
                      argv,
                      text=True,
                      stdout=subprocess.PIPE,
                      stderr=subprocess.STDOUT,
                      timeout=timeout,
                      check=False,
                      env=env,
                  )
              except Exception as exc:
                  return 255, type(exc).__name__
              return result.returncode, result.stdout[:100_000]

          commands = {
              name: shutil.which(name) is not None
              for name in ("gh", "git", "python3", "docker", "systemctl", "nginx", "certbot", "yc", "ss", "sudo", "openssl")
          }

          private_repo = False
          tag = None
          release = None
          host_gh_status = False
          if commands["gh"]:
              rc, _ = run(["gh", "auth", "status"], host_auth=True)
              host_gh_status = rc == 0
              rc, raw = run(
                  ["gh", "api", "repos/onedayonemasterpiece/dataset-loop-mcp"],
                  host_auth=True,
              )
              private_repo = rc == 0
              if private_repo:
                  rc, raw = run(
                      ["gh", "api", "repos/onedayonemasterpiece/dataset-loop-mcp/git/ref/tags/v0.1.0-alpha.3"],
                      host_auth=True,
                  )
                  if rc == 0:
                      ref = json.loads(raw)
                      object_sha = ref.get("object", {}).get("sha")
                      object_type = ref.get("object", {}).get("type")
                      if object_type == "tag" and object_sha:
                          rc2, raw2 = run(
                              ["gh", "api", f"repos/onedayonemasterpiece/dataset-loop-mcp/git/tags/{object_sha}"],
                              host_auth=True,
                          )
                          if rc2 == 0:
                              obj = json.loads(raw2)
                              tag = {
                                  "name": "v0.1.0-alpha.3",
                                  "type": object_type,
                                  "tag_object_sha": object_sha,
                                  "peeled_type": obj.get("object", {}).get("type"),
                                  "peeled_commit_sha": obj.get("object", {}).get("sha"),
                              }
                  rc, raw = run(
                      ["gh", "api", "repos/onedayonemasterpiece/dataset-loop-mcp/releases/tags/v0.1.0-alpha.3"],
                      host_auth=True,
                  )
                  if rc == 0:
                      value = json.loads(raw)
                      release = {
                          "id": value.get("id"),
                          "tag_name": value.get("tag_name"),
                          "prerelease": value.get("prerelease"),
                          "draft": value.get("draft"),
                          "assets": [
                              {
                                  "name": item.get("name"),
                                  "bytes": item.get("size"),
                                  "digest": item.get("digest"),
                              }
                              for item in value.get("assets", [])
                          ],
                      }

          def free_port() -> int | None:
              for port in range(8791, 8811):
                  sock = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
                  try:
                      sock.bind(("127.0.0.1", port))
                  except OSError:
                      pass
                  else:
                      return port
                  finally:
                      sock.close()
              return None

          edge_candidates: list[str] = []
          for path in root.rglob("*"):
              try:
                  if not path.is_file() or path.is_symlink() or path.stat().st_size > 2_000_000:
                      continue
                  if ".git" in path.parts or path.suffix.casefold() not in {".py", ".sh", ".conf", ".j2", ".jinja", ".tmpl", ".yaml", ".yml", ".toml", ".md"}:
                      continue
                  text = path.read_text(errors="ignore")
              except OSError:
                  continue
              if "mcp-datahub.kenigevents.ru" in text and "identity.kenigevents.ru" in text:
                  edge_candidates.append(str(path.relative_to(root)))

          public_key = root / "ops/dataset-loop-mcp/owner-delivery-public.pem"
          public_key_ok = False
          public_key_sha256 = None
          if public_key.is_file() and not public_key.is_symlink():
              rc, _ = run(["openssl", "pkey", "-pubin", "-in", str(public_key), "-noout"])
              public_key_ok = rc == 0
              public_key_sha256 = hashlib.sha256(public_key.read_bytes()).hexdigest()

          sudo_ok = False
          if commands["sudo"]:
              rc, _ = run(["sudo", "-n", "true"])
              sudo_ok = rc == 0

          docker_ok = False
          docker_version = None
          if commands["docker"]:
              rc, raw = run(["docker", "version", "--format", "{{.Server.Version}}"])
              docker_ok = rc == 0
              if docker_ok:
                  docker_version = raw.strip()

          user_systemd = False
          if commands["systemctl"]:
              rc, _ = run(["systemctl", "--user", "is-system-running"])
              user_systemd = rc in {0, 1}

          disk = os.statvfs(home)
          free_bytes = disk.f_bavail * disk.f_frsize
          selected_port = free_port()
          valid_release = bool(
              tag
              and tag.get("peeled_type") == "commit"
              and release
              and release.get("prerelease") is True
              and release.get("draft") is False
              and {item.get("name") for item in release.get("assets", [])}
              >= {
                  "dataset_loop_mcp-0.1.0a3-py3-none-any.whl",
                  "dataset_loop_mcp-0.1.0a3.tar.gz",
                  "SHA256SUMS",
              }
          )
          result = {
              "schema_version": 1,
              "status": "READY" if all((host_gh_status, private_repo, valid_release, public_key_ok, selected_port, user_systemd, free_bytes >= 1_000_000_000)) else "BLOCKED",
              "observed_at": datetime.now(UTC).isoformat(),
              "runner": {
                  "name_sha256": hashlib.sha256(os.environ.get("RUNNER_NAME", "").encode()).hexdigest(),
                  "os": os.environ.get("RUNNER_OS"),
                  "arch": os.environ.get("RUNNER_ARCH"),
                  "uid": os.getuid(),
                  "home": str(home),
              },
              "host_gh_authenticated": host_gh_status,
              "private_dataset_loop_repository_access": private_repo,
              "tag": tag,
              "release": release,
              "public_delivery_key_valid": public_key_ok,
              "public_delivery_key_sha256": public_key_sha256,
              "commands": commands,
              "passwordless_sudo": sudo_ok,
              "docker_server_available": docker_ok,
              "docker_server_version": docker_version,
              "user_systemd_available": user_systemd,
              "selected_free_loopback_port": selected_port,
              "disk_free_bytes": free_bytes,
              "edge_source_candidates": sorted(edge_candidates),
              "existing_state": {
                  "my_data_hub": (home / ".local/state/my-data-hub-control-plane").exists(),
                  "dataset_loop_mcp": (home / ".local/state/dataset-loop-mcp").exists(),
              },
          }
          missing: list[str] = []
          checks = {
              "host_gh_auth": host_gh_status,
              "private_repo_access": private_repo,
              "valid_alpha3_prerelease": valid_release,
              "public_delivery_key": public_key_ok,
              "free_loopback_port": selected_port is not None,
              "user_systemd": user_systemd,
              "disk_space": free_bytes >= 1_000_000_000,
          }
          for name, ok in checks.items():
              if not ok:
                  missing.append(name)
          result["missing"] = missing
          temp.joinpath("dataset-loop-runner-probe.json").write_text(
              json.dumps(result, indent=2, sort_keys=True) + "\n"
          )
          PY

      - name: Persist sanitized probe evidence
        if: always()
        run: |
          set -euo pipefail
          test -s "$RUNNER_TEMP/dataset-loop-runner-probe.json"
          git fetch origin main
          git reset --hard origin/main
          mkdir -p ops/dataset-loop-mcp/evidence
          cp "$RUNNER_TEMP/dataset-loop-runner-probe.json" ops/dataset-loop-mcp/evidence/runner-probe.json
          python3 - <<'PY'
          import json
          import os
          import pathlib
          value = json.loads(pathlib.Path(os.environ["RUNNER_TEMP"], "dataset-loop-runner-probe.json").read_text())
          marker = {
              "schema_version": 1,
              "status": value["status"],
              "missing": value["missing"],
              "selected_free_loopback_port": value["selected_free_loopback_port"],
              "evidence": "ops/dataset-loop-mcp/evidence/runner-probe.json",
              "workflow_run_id": int(os.environ["GITHUB_RUN_ID"]),
          }
          pathlib.Path("ops/dataset-loop-mcp/runner-probe.completed.json").write_text(
              json.dumps(marker, indent=2, sort_keys=True) + "\n"
          )
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ops/dataset-loop-mcp/evidence/runner-probe.json ops/dataset-loop-mcp/runner-probe.completed.json
          if ! git diff --cached --quiet; then
            git commit -m "evidence: record Dataset Loop DevCoveer runner probe"
            git push origin HEAD:main
          fi
          expected=$(git rev-parse HEAD)
          actual=$(git ls-remote origin refs/heads/main | awk '{print $1}')
          test "$actual" = "$expected"
