name: tts-yazyki-rossii-hosted-once

on:
  push:
    branches:
      - chatgpt/tts-yazyki-rossii-20260830
    paths:
      - .github/workflows/tts-yazyki-rossii-hosted-once.yml

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"
  MY_DATA_HUB_MCP_CANARY_ENDPOINT: ${{ vars.MY_DATA_HUB_MCP_CANARY_ENDPOINT || 'https://mcp-datahub.kenigevents.ru/mcp' }}

jobs:
  submit-and-wait:
    environment:
      name: devstand
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      # A short-lived role-scoped bearer, when provisioned, is used only as an
      # Authorization header by the trusted provider client. It is never printed,
      # persisted, uploaded, or forwarded to Kaggle.
      MY_DATA_HUB_MCP_PROVIDER_OPERATOR_TOKEN: ${{ secrets.MY_DATA_HUB_MCP_PROVIDER_OPERATOR_TOKEN }}
    steps:
      - name: Checkout exact one-off source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install trusted provider client
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,kaggle]'

      - name: Require provider bearer without disclosing it
        shell: bash
        run: |
          set -euo pipefail
          test "${#MY_DATA_HUB_MCP_PROVIDER_OPERATOR_TOKEN}" -ge 24

      - name: Submit and monitor Qwen3-TTS Kaggle CPU run
        run: python scratch/tts-yazyki-rossii/submit.py

      - name: Upload exact provider receipts and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tts-yazyki-rossii-provider-control-hosted
          path: artifacts/tts-yazyki-rossii/
          if-no-files-found: warn
          retention-days: 7
