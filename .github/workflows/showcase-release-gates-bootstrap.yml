name: showcase-release-gates-bootstrap

# One-shot GitHub-hosted verification; the successful commit removes this workflow.
on:
  push:
    branches:
      - fix/showcase-release-gates-20260903

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/showcase-release-gates-20260903
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Apply deterministic Showcase integration repair
        run: python scripts/fix_showcase_full_ci.py
      - name: Stage one-shot bootstrap removal before validation
        run: |
          git rm -f scripts/fix_showcase_full_ci.py
          git rm -f .github/workflows/showcase-release-gates-bootstrap.yml
      - name: Verify diff is limited to the intended Showcase integration files
        run: |
          set -euo pipefail
          git diff --name-only \
            | grep -v -E '^(scripts/fix_showcase_full_ci\.py|\.github/workflows/showcase-release-gates-bootstrap\.yml)$' \
            | sort > "$RUNNER_TEMP/changed.txt"
          cat > "$RUNNER_TEMP/expected.txt" <<'EOF'
          docs/operations/ideahub-showcase-runtime.md
          src/my_data_hub/mcp/catalog.py
          src/my_data_hub/mcp/server.py
          tests/mcp/test_remote_runtime.py
          tests/showcase/test_env_contract_v2.py
          tests/test_architecture_invariants.py
          tests/test_remote_mcp_verifier.py
          EOF
          sort -o "$RUNNER_TEMP/expected.txt" "$RUNNER_TEMP/expected.txt"
          diff -u "$RUNNER_TEMP/expected.txt" "$RUNNER_TEMP/changed.txt"
      - name: Install development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Repository validation
        run: python scripts/validate_repository.py
      - name: Secret scan
        run: python scripts/scan_tracked_secrets.py
      - name: Compile
        run: python -m compileall -q src tests scripts
      - name: Full test suite
        run: pytest
      - name: Ruff
        run: ruff check .
      - name: Commit verified repair
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(showcase): close full CI integration gates'
          git push origin HEAD:fix/showcase-release-gates-20260903
