[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "my-data-hub"
version = "0.1.0"
description = "PostgreSQL-first personal data hub, orchestrator and MCP surface"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "aiohttp>=3.11,<4",
  "cryptography>=44,<51",
  "fastapi>=0.115,<1",
  "jsonschema>=4.23,<5",
  "mcp==2.0.0",
  "nbformat>=5.10,<6",
  "pglast>=7,<8",
  "psycopg[binary,pool]>=3.2,<4",
  "PyJWT[crypto]>=2.10,<3",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "PyYAML>=6.0,<7",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.25,<1",
  "hypothesis>=6.138,<7",
  "mypy>=1.15,<2",
  "ruff>=0.9,<1",
  "types-PyYAML>=6.0.12.20241230,<7",
]
ydb = ["ydb==3.31.2"]
kaggle = ["kaggle==2.2.4"]

[project.scripts]
my-data-hub = "my_data_hub.cli:main"
my-data-hub-mcp = "my_data_hub.mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/my_data_hub"]

[tool.hatch.build.force-include]
"sql/migrations" = "my_data_hub/master_runtime/sql/migrations"
"sql/admin/bootstrap_roles.sql" = "my_data_hub/master_runtime/sql/admin/bootstrap_roles.sql"
"sql/admin/role_contract.sql" = "my_data_hub/master_runtime/sql/admin/role_contract.sql"
"schemas/blogger-discovery-batch.v1.schema.json" = "my_data_hub/schemas/blogger-discovery-batch.v1.schema.json"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"notebooks/**" = ["E501"]
"scripts/validate_repository.py" = ["E501"]
# Russian prompts and rendered Markdown intentionally contain Unicode glyphs
# which RUF001 treats as confusable Latin characters. The import order in the
# large Gemini adapter is kept grouped by transport/domain responsibility.
"src/my_data_hub/voice_intake/gemini.py" = ["I001", "RUF001"]
"src/my_data_hub/voice_intake/markdown.py" = ["RUF001"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
follow_imports = "skip"
files = [
  "src/my_data_hub/checkpoints/manifest.py",
  "src/my_data_hub/control_plane/ledger/models.py",
  "src/my_data_hub/mcp/contracts.py",
  "src/my_data_hub/orchestrator/master/evidence.py",
  "src/my_data_hub/orchestrator/master/provider.py",
  "src/my_data_hub/voice_intake/*.py",
]

# The repository deliberately skips imported implementation bodies. FastAPI and
# Pydantic decorators/base classes are therefore seen as Any at this boundary;
# suppress only those external-typing artefacts while retaining strict checking
# for every function body and data-flow error in the voice package.
[[tool.mypy.overrides]]
module = [
  "my_data_hub.voice_intake.api",
  "my_data_hub.voice_intake.contracts",
]
disable_error_code = ["misc", "untyped-decorator"]

[[tool.mypy.overrides]]
module = "my_data_hub.voice_intake.gemini"
disable_error_code = ["misc", "no-untyped-def"]

[[tool.mypy.overrides]]
module = "my_data_hub.voice_intake.github"
disable_error_code = ["assignment"]
