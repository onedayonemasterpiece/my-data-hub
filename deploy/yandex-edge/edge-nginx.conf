map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

limit_req_zone $binary_remote_addr zone=mdh_public:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=mdh_connections:10m;

server {
    listen 8080 default_server;
    server_name _;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / { return 421; }
}

server {
    listen 8080;
    server_name mcp-datahub.kenigevents.ru;

    access_log /var/log/nginx/my-data-hub-edge-access.log combined;
    error_log /var/log/nginx/my-data-hub-edge-error.log warn;

    client_max_body_size 1m;
    client_body_timeout 15s;
    keepalive_timeout 30s;
    send_timeout 300s;
    limit_conn mdh_connections 20;
    limit_req zone=mdh_public burst=40 nodelay;

    location ^~ /internal/ {
        proxy_pass http://127.0.0.1:18080;
        include /etc/nginx/snippets/my-data-hub-proxy.conf;
    }

    location / {
        proxy_pass http://127.0.0.1:18765;
        include /etc/nginx/snippets/my-data-hub-proxy.conf;
    }
}

server {
    listen 8080;
    server_name identity.kenigevents.ru;
    access_log /var/log/nginx/my-data-hub-edge-access.log combined;
    error_log /var/log/nginx/my-data-hub-edge-error.log warn;
    client_max_body_size 1m;
    client_body_timeout 15s;
    keepalive_timeout 30s;
    send_timeout 300s;
    limit_conn mdh_connections 20;
    limit_req zone=mdh_public burst=40 nodelay;

    location / {
        proxy_pass http://127.0.0.1:18780;
        include /etc/nginx/snippets/my-data-hub-proxy.conf;
    }
}
