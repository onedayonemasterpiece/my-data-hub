worker_processes 1;
pid /tmp/nginx.pid;

events {
    worker_connections 512;
}

http {
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    access_log /dev/stdout;
    error_log /dev/stderr warn;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;

    server {
        listen 127.0.0.1:8791;
        server_name ideas.kenigevents.ru;
        root /var/www/showcase;

        add_header X-Robots-Tag "noindex, noarchive" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'" always;
        add_header Cache-Control "no-store" always;

        location = /healthz {
            access_log off;
            return 204;
        }

        location /v/ {
            try_files $uri $uri/ $uri/index.html =404;
        }

        location / {
            return 404;
        }
    }
}
